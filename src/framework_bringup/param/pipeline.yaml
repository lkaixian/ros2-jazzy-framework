# Central parameters. Precedence (low -> high): package defaults < this file < launch argument.
# Edit freely; framework_bringup is installed with symlinks, so no rebuild is needed.
# Use another folder with:  params_dir:=/path/to/my_param
# Keys must match a declared parameter of the node (check with: ros2 run framework_bringup check_params).

llm_bridge_node:
  ros__parameters:
    server_url: "http://127.0.0.1:8080"
    model: default
    temperature: 0.1
    max_tokens: 512
    timeout_sec: 60.0
    task_system_prompt: ""  # "" = built-in prompt

bt_slm_node:
  ros__parameters:
    model_path: ""          # fine-tuned SLM dir; "" = rule-based fallback
    device: cpu
    max_new_tokens: 768
    temperature: 0.0

bt_validator_node:
  ros__parameters:
    max_depth: 12
    max_nodes: 64

orchestrator_node:
  ros__parameters:
    max_attempts: 3
    call_timeout_sec: 60.0

scene_summarizer_node:
  ros__parameters:
    window_sec: 2.0
    period_sec: 1.0

bt_executor_node:
  ros__parameters:
    dry_run: true           # true: extension nodes only log; false: commands hardware
    auto_run: false         # true: run every valid plan immediately
    tick_hz: 20.0
    max_runtime_sec: 300.0
    perception_max_age_sec: 1.0
