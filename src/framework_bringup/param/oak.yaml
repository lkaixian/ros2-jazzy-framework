# Luxonis OAK-D-LITE on the arm ("arm eye"): arguments for depthai_ros_driver/launch/camera.launch.py
# (read by sensors.launch.py enable_oak:=true; NOT a ROS parameter file). Values are passed as strings.
# Topics: /arm_cam/rgb/image_raw, /arm_cam/stereo/image_raw (depth), /arm_cam/rgb/camera_info.
# A leftover component_container from an unclean shutdown holds the camera and the next launch then hangs silently: stop it first.
# Measured 2026-11-25: connects over USB 2 (480 Mbit) at ~9 Hz with the stock profile; a USB 3 port/cable is the first thing to try for more.
name: arm_cam
namespace: ""
camera_model: OAK-D-LITE
pointcloud.enable: false            # big CPU/USB cost; enable only when you need the cloud
# NO hand-eye calibration yet: parent_frame is not part of the robot's TF tree, so these frames are unconnected on purpose.
# When the camera pose on the arm is measured, set parent_frame to the arm link and cam_pos_x/y/z + cam_roll/pitch/yaw.
parent_frame: oak-d-base-frame
