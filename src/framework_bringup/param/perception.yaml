# Central parameters. Precedence (low -> high): package defaults < this file < launch argument.
# Edit freely; framework_bringup is installed with symlinks, so no rebuild is needed.
# Use another folder with:  params_dir:=/path/to/my_param
# Keys must match a declared parameter of the node (check with: ros2 run framework_bringup check_params).

object_detection_node:
  ros__parameters:
    model: yolo26s.pt
    openvino: false
    conf: 0.4
    device: ""              # "" = auto, "cpu", "0" (GPU)
    image_topic: ""         # "" = open the webcam
    rotate: 0               # degrees (0/90/180/270) to turn this node's input upright; the arm eye (OAK) is mounted upside down: 180
    raw_topic: /camera/image_raw   # also publish the raw webcam frames (person_detection reads them)
    camera_index: 0
    rate_hz: 30.0
    show: false
    publish_image: true
    frame_id: camera

person_detection_node:
  ros__parameters:
    model: yolo26s-pose.pt  # yolo26s.pt for boxes only
    openvino: false
    conf: 0.4
    device: ""
    image_topic: /camera/image_raw   # raw webcam frames from object_detection_node (raw_topic); "" = open the webcam here
    rotate: 0               # degrees (0/90/180/270) to turn this node's input upright; the arm eye (OAK) is mounted upside down: 180
    image_out: detections/person_image
    camera_index: 0
    rate_hz: 30.0
    show: false
    publish_image: true
    frame_id: camera
    track: true
    reid_model: auto        # stable person ids from appearance (OSNet ONNX): auto = models/reid/osnet_ain_x1_0.onnx, "" = off (then ids are the tracker's)
    reid_sim: 0.64          # same-person score (network + colour); 0.70 split the same person on real crops, 0.64 is from a few minutes of footage: re-measure with tools/reid/compare.py
    reid_keep_sec: 900.0
    reid_confirm_frames: 5
    blur_ratio: 0.6
    colour_weight: 0.4
    memory_topic: detections/reid_memory   # a picture of what it remembers ("" = off)
    dump_dir: ""            # save one crop per second per person for tools/reid/compare.py

face_recognition_node:
  ros__parameters:
    model: yolo26s-face.pt  # face detector, 5 landmarks (akanametov/yolo-face release 1.0.0, GPL-3.0); in the repo root. yolo26n-face.pt = lighter
    openvino: false
    conf: 0.4
    device: ""
    image_topic: /camera/image_raw   # raw webcam frames (object_detection_node raw_topic); "" = open the webcam here
    rotate: 0               # degrees (0/90/180/270) to turn this node's input upright; the arm eye (OAK) is mounted upside down: 180
    image_out: detections/face_image
    camera_index: 0
    rate_hz: 30.0
    show: false
    publish_image: true
    frame_id: camera
    embed_model: yolo26n-cls.pt
    gallery_dir: faces      # one <name>.npy per identity
    threshold: 0.6          # cosine similarity needed to name a face
    publish_embedding: true # required by the BT node ExtractFaceFeature
    enroll_max_age_sec: 2.0

auto_register_node:         # unknown face in view -> ask who it is and enrol it (macro register_person); runs with enable_face
  ros__parameters:
    enabled: true
    unknown_sec: 2.5        # the biggest face must stay unknown this long
    gap_sec: 0.6            # a missed frame or two does not reset the timer
    cooldown_sec: 60.0      # after asking once, stay quiet this long
    min_conf: 0.6
    min_width_px: 60.0      # ignore small (far away) faces
    startup_grace_sec: 10.0 # wait this long after start, and for the tts/speak service, before asking anyone

person_depth_node:          # optional: persons + aligned depth -> persons_ranged (distance_m)
  ros__parameters:
    depth_topic: /camera/camera/aligned_depth_to_color/image_raw
    persons_in: persons
    persons_out: persons_ranged   # point pid_extension persons_topic at this for metric FollowTarget
    region_frac: 0.4
    min_m: 0.2
    max_m: 8.0
    max_age_sec: 0.25
