# Central parameters. Precedence (low -> high): package defaults < this file < launch argument.
# Edit freely; framework_bringup is installed with symlinks, so no rebuild is needed.
# Use another folder with:  params_dir:=/path/to/my_param
# Keys must match a declared parameter of the node (check with: ros2 run framework_bringup check_params).

battery_guard_node:            # halts the plan on a critically low Kobuki battery (thresholds: Kobuki driver defaults, unverified here)
  ros__parameters:
    topic: sensors/core
    low_v: 14.0
    critical_v: 13.2
    debounce_sec: 3.0
    repeat_sec: 5.0

cmd_vel_mux_node:
  ros__parameters:
    inputs: [teleop/cmd_vel, odom_extension/cmd_vel, pid_extension/cmd_vel, nav2/cmd_vel]   # highest priority first; teleop = manual override (framework_bringup teleop)
    output: cmd_vel
    stamped: false
    timeout_sec: 0.5        # watchdog: no fresh input -> zero Twist
    max_linear: 0.3         # hard clamp, m/s
    max_angular: 0.8        # hard clamp, rad/s
    rate_hz: 20.0
    accel_linear: 0.5       # m/s^2 ramp on commanded changes; watchdog/latch stops are instant. 0 = off
    accel_angular: 1.5      # rad/s^2
    safety_events_enabled: true   # false = bumper/cliff ignored (sim without kobuki msgs)
    bumper_topic: events/bumper   # Kobuki driver, relative to its namespace
    cliff_topic: events/cliff
    bump_recovery_enabled: true   # bumper-only latch: back off bump_back_dist, turn away (side) or 90 deg (centre/both = wall); latch stays set. Unverified: backs up blind
    bump_back_dist: 0.10          # m, timed open loop at 0.1 m/s
    estop_topic: estop            # std_msgs/Bool from tools/estop/estop_node.py (ESP32 button). True/silent = stopped (fail-closed); empty = not watched
    estop_timeout_sec: 1.0

odom_extension_node:
  ros__parameters:
    odom_topic: odom
    cmd_vel_topic: odom_extension/cmd_vel
    max_linear: 0.2
    max_angular: 0.6
    kv: 0.8
    kw: 1.5
    default_timeout_sec: 60.0
    stale_sec: 0.5
    scan_topic: scan            # lidar guard for DriveDistance/NavigateTo: stop for an obstacle in the travel direction
    stop_distance: 0.30         # m
    guard_half_width_deg: 35.0
    scan_stale_sec: 0.5
    scan_required: true         # no fresh scan = refuse to drive (real robot). Lidar-less sims (nav_sim has its own scan): set false
    scan_yaw_offset: 3.1416     # rad, lidar yaw relative to the base forward axis: must match base_to_laser yaw in navigation.yaml
    turn_clearance: 0.22        # m: RotateBy refuses to turn with anything closer than this in any direction (Kobuki radius 0.18 + margin; 0 = off)
    rate_hz: 20.0
    republish_sec: 3.0

pid_extension_node:
  ros__parameters:
    odom_topic: odom
    persons_topic: persons
    cmd_vel_topic: pid_extension/cmd_vel
    max_linear: 0.3             # = the mux clamp: at 0.15 a person walking at 0.2 m/s out-walks FollowTarget and is lost (follow_sim_test, help_me_carry_sim_test)
    max_angular: 0.6
    stale_sec: 0.5
    lost_sec: 1.0
    rate_hz: 20.0
    republish_sec: 3.0
    scan_topic: scan             # FollowTarget(approach=true) stops for anything closer than stop_distance ahead
    stop_distance: 0.40          # m (people: keep at least this far)
    guard_half_width_deg: 35.0
    scan_stale_sec: 0.5
    scan_required: true         # no fresh scan = refuse to drive (real robot)
    scan_yaw_offset: 3.1416     # rad: lidar faces backwards on this robot (= base_to_laser yaw in navigation.yaml)
    blocked_give_up_sec: 3.0     # blocked this long -> the node fails instead of waiting forever
    cam_height: 0.8              # m: RealSense lens above the floor (about, from memory, not measured); BackUpForFace uses it
    vfov_deg: 42.0               # RealSense colour vertical field of view
    avoid_turn: 0.4              # rad/s: FollowTarget turns this fast toward the freer side when an obstacle (not the person) is ahead

pose_extension_node:
  ros__parameters:
    persons_topic: persons
    objects_topic: objects
    window_sec: 1.5
    max_age_sec: 0.7
    republish_sec: 3.0
    faces_topic: faces
    image_topic: /camera/image_raw     # raw frames for DescribeAttributes (the main camera, not the arm eye)
    face_parsing_model: ""            # "" = models/face_parsing/yolo26l-sem*.pt, else yolo26n-sem*.pt (docs/perception.md)
    min_face_px: 60                    # DescribeAttributes: a narrower face is too far to judge
    candidates_topic: /arm_eye/objects   # NextObject: what the arm eye sees (tools/arm/arm_eye.sh)
    categories_file: ""                  # "" = framework_bringup param/object_categories.yaml

arm_extension_node:         # guarded arm (src/arm_control): moves nothing while live is false
  ros__parameters:
    map_file: ''            # '' = the newest ~/arm_free_space*.npz (the baseline first)
    require_health: true    # live motion needs a recent, clean arm/health (fail closed)
    health_max_age_sec: 5.0
    live: false             # true = really drive the arm (bt_executor dry_run:=false must also be set). Validate on hardware first.
    rate: 0.03              # rad/s of the furthest joint: the speed the park was validated at
    objects_topic: /arm_eye/objects
    depth_topic: /arm_cam/stereo/image_raw
    # Where the pick finds the object. arm_eye = the OAK on the gripper (blind inside ~0.36 m). base_camera = the RealSense bolted next to the
    # arm base: set objects_topic: /objects, depth_topic: /camera/camera/aligned_depth_to_color/image_raw,
    # fixed_cam_info_topic: /camera/camera/aligned_depth_to_color/camera_info, target_source: base_camera. Its image must be upright and look
    # forward (parallel to the arm's rest direction). UNVERIFIED: compare its point with the OAK's at >= 0.45 m before any live pick.
    # Look-track-look: the pick first needs `track_cycles` steady looks (Kalman filter, pinned object id 1). A missed look coasts on the
    # prediction; after `track_scan_after` misses in a row the eye-in-hand camera turns (joint 1 only) toward the predicted point inside
    # workspace_min/max, `scan_fov_rad` per step; after `track_give_up` misses it refuses.
    track_cycles: 4
    track_max_cycles: 20
    track_period_sec: 0.4
    track_scan_after: 3
    track_give_up: 12
    track_max_sigma_m: 0.02
    scan_fov_rad: 0.5
    target_source: arm_eye
    fixed_cam_xyz: [0.0, -0.08, -0.02]   # RealSense lens in the arm frame (x fwd, y left, z up), m. HAND-ESTIMATED 2026-11-26, not ruler-checked
    fixed_cam_info_topic: ''
    base_to_arm_x: 0.16     # arm joint-1 axis ahead of the Kobuki centre (m, best effort): FaceObject turns the base about ITS centre
    face_max_turn_rad: 0.6  # FaceObject refuses a turn bigger than this (about 34 deg)
    approach_m: 0.06
    grasp_pitch_deg: -30.0  # finger angle above horizontal (negative = pointing down). Level fingers cannot reach the pre-grasp pose (approach_m
                            # nearer the base) for an object ~0.2-0.26 m out at the arm's height; -20 or steeper can, -30 leaves margin on joint 4.
                            # Made the first real pick work 2026-11-27 (empty plastic bottle, RealSense source).
    grasp_depth_offset_m: 0.03   # ESTIMATE: front surface -> object middle
    workspace_min: [0.05, -0.4, -0.3]   # arm base frame, metres. ESTIMATE: the free-space map is the real limit
    workspace_max: [0.45, 0.4, 0.4]
    gripper_open_gap_mm: 60.0
    gripper_max_gap_mm: 72.0
    gripper_max_effort: 20.0
    goal_current_cap: 250   # gripper Goal Current register units (0.67 A): refuse to move it above this
    places: ['']            # "name:x,y,z" in the arm base frame, metres: where PlaceObject may put things down. ESTIMATES until measured on the arm.
    object_width_mm: ['']   # "label:mm" entries; a label wider than gripper_max_gap_mm is refused
    republish_sec: 3.0

arm_health_node:            # servo health -> arm/health; arm_extension refuses live motion unless it is ok
  ros__parameters:
    auto_reboot: false      # true: reboot the servos by itself, but only with the arm parked at rest and still. A reboot drops torque on ALL servos.
    poll_sec: 2.0
    stale_sec: 3.0
    dxl_ids: [11, 12, 13, 14, 15]
    rest_pose: [0.0, -1.85, 1.52, 0.45]   # keep equal to param/arm_rest_pose.yaml
    ns: /dynamixel_hardware_interface

social_extension_node:
  ros__parameters:
    speak_service: tts/speak
    stop_service: tts/stop
    enroll_service: face/enroll
    speak_timeout_sec: 30.0
    enroll_timeout_sec: 10.0
    transcript_topic: stt/transcript
    events_topic: audio/events
    republish_sec: 3.0

nav_extension_node:         # Nav2 BT nodes; needs navigation.launch.py (see docs/navigation.md)
  ros__parameters:
    nav2_action: navigate_to_pose
    base_frame: base        # Kobuki driver frame (not base_link)
    global_frame: map
    places_file: ""         # "" = param/places.yaml of framework_bringup
    map_dir: ~/maps         # SaveMap writes <map_dir>/<file>.yaml/.pgm (plain file names only)
    default_timeout_sec: 180.0
    tf_timeout_sec: 0.5
    initial_pose_topic: initialpose
    saver_service: map_saver/save_map
    clear_local_service: local_costmap/clear_entirely_local_costmap
    clear_global_service: global_costmap/clear_entirely_global_costmap
    republish_sec: 3.0
