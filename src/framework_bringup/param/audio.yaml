# Central parameters. Precedence (low -> high): package defaults < this file < launch argument.
# Edit freely; framework_bringup is installed with symlinks, so no rebuild is needed.
# Use another folder with:  params_dir:=/path/to/my_param
# Keys must match a declared parameter of the node (check with: ros2 run framework_bringup check_params).

audio_capture_node:
  ros__parameters:
    source: arecord         # arecord | file
    device: "plughw:3,0"    # ALSA device (arecord -l). Laptop DMIC now; swap for the real mic, or "" = default
    file: ""                # 16 kHz mono 16-bit WAV when source: file
    loop: false
    sample_rate: 16000
    channels: 1
    chunk_ms: 100
    dc_block: true          # remove a constant mic offset (the laptop DMIC has ~7400): else the VAD hears speech forever
    frame_id: microphone

vad_node:
  ros__parameters:
    threshold_rms: 500.0
    noise_ratio: 3.0
    min_speech_ms: 150
    hangover_ms: 600
    preroll_ms: 300
    max_utterance_sec: 15.0
    mute_while_speaking: true
    mute_tail_ms: 400

sound_event_node:           # steady-tone (doorbell) detector; tuned on synthetic tones only
  ros__parameters:
    window_sec: 0.12
    need_windows: 3
    freq_tolerance: 0.04
    peak_ratio: 0.5
    min_rms: 300.0
    refractory_sec: 2.0

stt_node:
  ros__parameters:
    engine: faster_whisper  # faster_whisper | vosk | mock
    model: base.en          # portable default (downloads on first use); setup.sh writes the model chosen for this computer to models/local.yaml, which overrides this
    language: ""
    device: cpu             # cuda needs CUDA 12 cuBLAS + cuDNN 9; the node falls back to cpu/int8 if they are missing
    compute_type: int8
    min_confidence: 0.0

transcript_to_task_node:
  ros__parameters:
    wake_word: robot        # "" = every transcript is a task; "robot, ..." or a bare "robot" then the task
    wake_window_sec: 8.0
    start_phrase: ""        # a competition task that starts only on this spoken signal, e.g. "start the task,start task" (see the edu_* launch files); "" = off
    start_spec: ""          # the task spec (JSON) published on bt/task_spec when the start phrase is heard; while set, no other speech becomes a task
    start_cooldown_sec: 30.0

tts_node:
  ros__parameters:
    engine: espeak          # espeak (robotic, no model) | piper | kokoro | mock
    voice: ""               # kokoro needs a voice name here
    rate: 160
    piper_model: ""
    piper_rate: 22050
    audio_device: ""
    max_queue: 16
    kokoro_model: ""
    kokoro_voices: ""
    kokoro_speed: 1.0
    kokoro_lang: en-us

plan_announcer_node:
  ros__parameters:
    speak_errors: true
    max_errors_spoken: 2
