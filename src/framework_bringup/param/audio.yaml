# Central parameters. Precedence (low -> high): package defaults < this file < launch argument.
# Edit freely; framework_bringup is installed with symlinks, so no rebuild is needed.
# Use another folder with:  params_dir:=/path/to/my_param
# Keys must match a declared parameter of the node (check with: ros2 run framework_bringup check_params).

audio_capture_node:
  ros__parameters:
    source: arecord         # arecord | file
    device: "plughw:3,0"    # ALSA device (arecord -l). Laptop DMIC now; swap for the real mic, or "" = default
    file: ""                # 16 kHz mono 16-bit WAV when source: file
    loop: false
    sample_rate: 16000
    channels: 1
    chunk_ms: 100
    dc_block: true          # remove a constant mic offset (the laptop DMIC has ~7400): else the VAD hears speech forever
    frame_id: microphone

vad_node:
  ros__parameters:
    threshold_rms: 500.0
    noise_ratio: 3.0
    min_speech_ms: 150
    hangover_ms: 600
    preroll_ms: 300
    max_utterance_sec: 15.0
    mute_while_speaking: true
    mute_tail_ms: 400

sound_event_node:           # steady-tone (doorbell) detector; tuned on synthetic tones only
  ros__parameters:
    window_sec: 0.12
    need_windows: 3
    freq_tolerance: 0.04
    peak_ratio: 0.5
    min_rms: 300.0
    refractory_sec: 2.0

stt_node:
  ros__parameters:
    engine: faster_whisper  # faster_whisper | vosk | mock
    model: /home/larm/ros2-jazzy-robocup-fw/models/stt/models--Systran--faster-whisper-base.en/snapshots/3d3d5dee26484f91867d81cb899cfcf72b96be6c   # local folder: a bare name makes faster-whisper contact huggingface.co first, which hung start-up
    language: ""
    device: cpu
    compute_type: int8
    min_confidence: 0.0

transcript_to_task_node:
  ros__parameters:
    wake_word: robot        # "" = every transcript is a task; "robot, ..." or a bare "robot" then the task
    wake_window_sec: 8.0

tts_node:
  ros__parameters:
    engine: piper           # espeak (robotic, no model) | piper | kokoro | mock
    voice: ""               # kokoro needs a voice name here
    rate: 160
    piper_model: /home/larm/ros2-jazzy-robocup-fw/models/tts/en/en_US/lessac/medium/en_US-lessac-medium.onnx
    piper_rate: 22050
    audio_device: ""
    max_queue: 16
    kokoro_model: ""
    kokoro_voices: ""
    kokoro_speed: 1.0
    kokoro_lang: en-us

plan_announcer_node:
  ros__parameters:
    speak_errors: true
    max_errors_spoken: 2
