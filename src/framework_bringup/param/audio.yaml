# Central parameters. Precedence (low -> high): package defaults < this file < launch argument.
# Edit freely; framework_bringup is installed with symlinks, so no rebuild is needed.
# Use another folder with:  params_dir:=/path/to/my_param
# Keys must match a declared parameter of the node (check with: ros2 run framework_bringup check_params).

audio_capture_node:
  ros__parameters:
    source: arecord         # arecord | file
    device: ""              # ALSA device, e.g. plughw:2,0
    file: ""                # 16 kHz mono 16-bit WAV when source: file
    loop: false
    sample_rate: 16000
    channels: 1
    chunk_ms: 100
    frame_id: microphone

vad_node:
  ros__parameters:
    threshold_rms: 500.0
    noise_ratio: 3.0
    min_speech_ms: 150
    hangover_ms: 600
    preroll_ms: 300
    max_utterance_sec: 15.0
    mute_while_speaking: true
    mute_tail_ms: 400

stt_node:
  ros__parameters:
    engine: faster_whisper  # faster_whisper | vosk | mock
    model: base.en
    language: ""
    device: cpu
    compute_type: int8
    min_confidence: 0.0

transcript_to_task_node:
  ros__parameters:
    wake_word: ""           # e.g. robot
    wake_window_sec: 8.0

tts_node:
  ros__parameters:
    engine: espeak          # espeak | piper | kokoro | mock
    voice: ""               # kokoro needs a voice name here
    rate: 160
    piper_model: ""
    piper_rate: 22050
    audio_device: ""
    max_queue: 16
    kokoro_model: ""
    kokoro_voices: ""
    kokoro_speed: 1.0
    kokoro_lang: en-us

plan_announcer_node:
  ros__parameters:
    speak_errors: true
    max_errors_spoken: 2
