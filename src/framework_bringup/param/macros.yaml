# Macros: named step lists the LLM can call as {"macro": "<name>", "args": {...}} instead of writing
# every node (fewer tokens = faster plans). Expanded in plain code before the SLM / rule generator;
# Tests expand and validate every macro here against the real node catalog
# (src/bt_validator/test/test_macro_library.py), so a typo in a node or port fails the build.
#   params: name -> {required: true | default: "..."}   (values are strings; ${name} in any value)
#   example_args: used by the test. A macro may call other macros (max depth 4, no cycles).
# Whitelist: the ONLY macros a task spec (LLM / SLM) may call; the validator's catalog, the LLM's JSON schema and the
# orchestrator all honour it. Macros may still call any macro inside their own steps. Remove a name to hide it.
whitelist:
  - say
  - go_to_place
  - go_and_say
  - patrol
  - turn_around
  - greet_person
  - approach_person
  - wave_back
  - report_object
  - return_home
  - look_around
  - find_person
  - find_object
  - pick_object
  - put_down
  - move_object
  - go_find_object
  - go_find_person
  - go_find_and_say
  - meet_and_remember
  - follow_person
  - look_at_person
  - acknowledge_person
  - meet_guest
  - register_person
  - greet_or_register
  - look_at_guest
  - introduce_new_guest
  - introduce_pair
  - enroll_host
  - describe_guest
  - luggage_round
  - mates_round
  - mates_visit
  - mates_report
  - describe_features
  - introduce_guest
  - patrol_laps
  - wait_for_doorbell
  - offer_seat
  - receive_guest
  - hric_round
  - follow_until_told
  - help_me_carry
  - introduce_to
  - find_waving_person
  - assist_waving_person
  - take_order
  - tell_order
  - restaurant_round
  - dispose_rubbish
  - clean_the_table_round
  - store_groceries_round
  - give_me_a_hand_round
  - egpsr_round
  - note_look
  - tell_look
  - wander
  - wander_until_person
  - scout_room
  - count_objects_at
  - count_people_at
  - count_people_wearing_at
  - tell_extreme_object_at
  - describe_person
  - announce_and_go
  - guide_to
  - escort_person_to
  - wait_for_wave
  - stop_and_wait
  - ask_and_repeat

macros:
  say:
    description: "Say one short sentence"
    params: {text: {required: true}}
    example_args: {text: "Hello"}
    steps:
      - {node: Speak, ports: {text: "${text}"}}

  go_to_place:
    description: "Drive to a named place from places.yaml; if blocked, clear the costmaps and try once more"
    params: {place: {required: true}}
    example_args: {place: door}
    steps:
      - group: Fallback
        steps:
          - {node: NavigateToPlace, ports: {place: "${place}"}}
          - group: Sequence
            steps:
              - {node: ClearCostmaps}
              - {node: NavigateToPlace, ports: {place: "${place}"}}

  go_and_say:
    description: "Drive to a named place, then say a sentence there"
    params: {place: {required: true}, text: {required: true}}
    example_args: {place: door, text: "I have arrived"}
    steps:
      - {macro: go_to_place, args: {place: "${place}"}}
      - {macro: say, args: {text: "${text}"}}

  patrol:
    description: "Visit two named places in order"
    params: {first: {required: true}, second: {required: true}}
    example_args: {first: left_room, second: right_room}
    steps:
      - {macro: go_to_place, args: {place: "${first}"}}
      - {macro: go_to_place, args: {place: "${second}"}}

  turn_around:
    description: "Rotate in place by half a turn"
    steps:
      - {node: RotateBy, ports: {radians: "3.14"}}

  greet_person:
    description: "Wait for a person, recognise the face and greet them by name (unknown -> there); keeps trying about 30 rounds"
    steps:
      - group: Fallback
        retry: 30
        steps:
          - group: Sequence
            steps:
              - {node: DetectPerson, ports: {min_conf: "0.5"}}
              - {node: ExtractFaceFeature, ports: {min_conf: "0.5", out_identity: "{who}", out_similarity: "{sim}"}}
              - {node: Speak, ports: {text: "Hello {person}", person: "{who}"}}
          - group: Sequence
            steps:
              - {node: Sleep, ports: {msec: "200"}}
              - {node: AlwaysFailure}

  approach_person:
    description: "Find a person and walk up to them, stopping at a stand-off distance in metres (min 0.5)"
    params: {distance: {default: "1.0"}}
    steps:
      - {node: DetectPerson}
      - {node: FollowTarget, ports: {approach: "true", distance: "${distance}"}}

  wave_back:
    description: "If a person is waving, say hello to them"
    steps:
      - {node: IsPersonWaving}
      - {node: Speak, ports: {text: "Hello!"}}

  report_object:
    description: "Do you see a <object>? Look for an object (label from the detector's list), turning once if not seen, and say what was found"
    params: {label: {required: true}}
    example_args: {label: person}
    steps:
      - group: Fallback
        steps:
          - group: Sequence
            steps:
              - {node: DetectObject, ports: {label: "${label}"}}
              - {node: Speak, ports: {text: "I can see a ${label}"}}
          - group: Sequence
            steps:
              - {node: RotateBy, ports: {radians: "1.57"}}
              - {node: DetectObject, ports: {label: "${label}"}}
              - {node: Speak, ports: {text: "I can see a ${label} now"}}
          - {node: Speak, ports: {text: "I cannot see a ${label}"}}

  # ---- batch A: built only from nodes that exist today (see notes/MACROS_PLAN.md) ----
  return_home:
    description: "Drive back to the start place (only when asked to go home or return)"
    steps:
      - {macro: go_to_place, args: {place: start}}

  look_around:
    description: "Turn a full circle in four quarter turns (no detection, use before find_*)"
    steps:
      - {node: RotateBy, ports: {radians: "1.57"}}
      - {node: RotateBy, ports: {radians: "1.57"}}
      - {node: RotateBy, ports: {radians: "1.57"}}
      - {node: RotateBy, ports: {radians: "1.57"}}

  find_person:
    description: "Look for a person, turning up to three quarter turns; says so and FAILS if nobody is seen"
    steps:
      - group: Fallback
        steps:
          - {node: DetectPerson}
          - group: Sequence
            steps:
              - {node: RotateBy, ports: {radians: "1.57"}}
              - {node: DetectPerson}
          - group: Sequence
            steps:
              - {node: RotateBy, ports: {radians: "1.57"}}
              - {node: DetectPerson}
          - group: Sequence
            steps:
              - {node: RotateBy, ports: {radians: "1.57"}}
              - {node: DetectPerson}
          - group: Sequence
            steps:
              - {node: Speak, ports: {text: "I cannot find anyone"}}
              - {node: AlwaysFailure}

  find_object:
    description: "Only look for an object (detector label), turning up to three quarter turns; says so and FAILS if not seen; it never picks up or carries"
    params: {label: {required: true}}
    example_args: {label: person}
    steps:
      - group: Fallback
        steps:
          - {node: DetectObject, ports: {label: "${label}"}}
          - group: Sequence
            steps:
              - {node: RotateBy, ports: {radians: "1.57"}}
              - {node: DetectObject, ports: {label: "${label}"}}
          - group: Sequence
            steps:
              - {node: RotateBy, ports: {radians: "1.57"}}
              - {node: DetectObject, ports: {label: "${label}"}}
          - group: Sequence
            steps:
              - {node: RotateBy, ports: {radians: "1.57"}}
              - {node: DetectObject, ports: {label: "${label}"}}
          - group: Sequence
            steps:
              - {node: Speak, ports: {text: "I cannot find the ${label}"}}
              - {node: AlwaysFailure}

  pick_object:
    description: "Pick up an object (detector label) that the arm camera sees right here; says so and FAILS if it cannot. The robot then holds it"
    params: {label: {required: true}}
    example_args: {label: cup}
    steps:
      - group: Fallback
        steps:
          - {node: PickObject, ports: {label: "${label}"}}
          - group: Sequence
            steps:
              - {node: Speak, ports: {text: "I could not pick up the ${label}"}}
              - {node: AlwaysFailure}

  put_down:
    description: "Put the object being held down at a named arm place (table, shelf, bin), let go, and fold the arm away"
    params: {place: {required: true}}
    example_args: {place: table}
    steps:
      - group: Fallback
        steps:
          - group: Sequence
            steps:
              - {node: PlaceObject, ports: {place: "${place}"}}
              - {node: ArmPark}
          - group: Sequence
            steps:
              - {node: Speak, ports: {text: "I could not put it down at the ${place}"}}
              - {node: AlwaysFailure}

  move_object:
    description: "Take an object from one place to another: go to from_place, pick the object up, go to to_place, put it down at the arm place put_place (table, shelf, bin)"
    params: {label: {required: true}, from_place: {required: true}, to_place: {required: true}, put_place: {required: true}}
    example_args: {label: cup, from_place: kitchen, to_place: door, put_place: table}
    steps:
      - {macro: go_to_place, args: {place: "${from_place}"}}
      - {macro: pick_object, args: {label: "${label}"}}
      - {macro: go_to_place, args: {place: "${to_place}"}}
      - {macro: put_down, args: {place: "${put_place}"}}

  go_find_object:
    description: "Go to a named place and only look for an object there (never picks up, takes or brings it)"
    params: {place: {required: true}, label: {required: true}}
    example_args: {place: door, label: person}
    steps:
      - {macro: go_to_place, args: {place: "${place}"}}
      - {macro: find_object, args: {label: "${label}"}}

  go_find_person:
    description: "Go to a named place and look for a person there"
    params: {place: {required: true}}
    example_args: {place: door}
    steps:
      - {macro: go_to_place, args: {place: "${place}"}}
      - {macro: find_person}

  go_find_and_say:
    description: "Go to a place, find a person, walk up to them and say a sentence"
    params: {place: {required: true}, text: {required: true}}
    example_args: {place: door, text: "Hello"}
    steps:
      - {macro: go_find_person, args: {place: "${place}"}}
      - {macro: approach_person}
      - {macro: say, args: {text: "${text}"}}

  meet_and_remember:
    description: "Walk up to a person, store their face under a name (A-Z a-z 0-9 _ -) and greet them"
    params: {name: {required: true}}
    example_args: {name: alice}
    steps:
      - {macro: approach_person}
      - {node: EnrollFace, ports: {person: "${name}"}}
      - {node: Speak, ports: {text: "Nice to meet you ${name}"}}

  follow_person:
    description: "Follow me / come with me / walk behind a person: find a person and follow them at a distance in metres (min 0.5); a person who disappears is looked for where they were last seen, and if still lost it turns a little, looks again and retries up to 3 times"
    params: {distance: {default: "1.0"}}
    steps:
      - {macro: find_person}
      - group: Fallback
        retry: 3
        steps:
          - {node: FollowTarget, ports: {approach: "true", distance: "${distance}", timeout_ms: "60000"}}
          - group: Sequence
            steps:
              - {node: RotateBy, ports: {radians: "0.8"}}
              - {node: DetectPerson}
              - {node: FollowTarget, ports: {approach: "true", distance: "${distance}", timeout_ms: "60000"}}

  look_at_person:
    description: "Turn the base until a visible person is centred in the camera (eye contact; no driving)"
    steps:
      - {node: DetectPerson}
      - {node: FollowTarget, ports: {timeout_ms: "5000"}}

  acknowledge_person:
    description: "Find a person, turn to face them and say hello (a greeting only: it does not follow or move with them)"
    steps:
      - {macro: find_person}
      - {macro: look_at_person}
      - {macro: say, args: {text: "Hello, I see you"}}

  guide_to:
    description: "Tell people to follow, drive to a named place, announce arrival"
    params: {place: {required: true}}
    example_args: {place: door}
    steps:
      - {macro: say, args: {text: "Please follow me"}}
      - group: Fallback          # wait up to 8 s until the lidar sees someone close behind (the guest), then go anyway
        steps:
          - group: Fallback
            retry: 8
            steps:
              - {node: CheckBehind}
              - group: Sequence
                steps:
                  - {node: Sleep, ports: {msec: "1000"}}
                  - {node: AlwaysFailure}
          - {node: AlwaysSuccess}
      - {macro: go_to_place, args: {place: "${place}"}}
      - group: Fallback          # arrived: is the guest still behind? if not, call them and wait a few seconds
        steps:
          - {node: CheckBehind}
          - group: Sequence
            steps:
              - {node: Speak, ports: {text: "Please come to me"}}
              - {node: Sleep, ports: {msec: "4000"}}
              - {node: AlwaysSuccess}
      - {macro: say, args: {text: "We have arrived"}}

  escort_person_to:
    description: "Find a person and guide them to a named place"
    params: {place: {required: true}}
    example_args: {place: door}
    steps:
      - {macro: find_person}
      - {macro: guide_to, args: {place: "${place}"}}

  wait_for_wave:
    description: "Wait (about 30 rounds) until someone waves, then say hello"
    steps:
      - group: Fallback
        retry: 30
        steps:
          - group: Sequence
            steps:
              - {node: IsPersonWaving}
              - {node: Speak, ports: {text: "Hello!"}}
          - group: Sequence
            steps:
              - {node: Sleep, ports: {msec: "200"}}
              - {node: AlwaysFailure}

  stop_and_wait:
    description: "Do nothing for a number of milliseconds"
    params: {msec: {default: "2000"}}
    steps:
      - {node: Sleep, ports: {msec: "${msec}"}}

  ask_and_repeat:
    description: "Ask a question out loud, listen for one answer (10 s) and say it back; fails if nobody answers"
    params: {question: {required: true}}
    example_args: {question: "What is your name?"}
    steps:
      - {macro: say, args: {text: "${question}"}}
      - {node: WaitForTranscript, ports: {out_text: "{answer}"}}
      - {node: Speak, ports: {text: "I heard {person}", person: "{answer}"}}

  meet_guest:
    description: "At the door: ask the guest's name, say it back and welcome them, ask the favourite drink, say it back, and enrol the face; retries each question twice (slot = guest1, guest2 ...)"
    params: {slot: {default: guest1}}
    example_args: {slot: guest1}
    steps:
      - group: Fallback
        retry: 2
        steps:
          - group: Sequence
            steps:
              - {node: Speak, ports: {text: "Hi, may I know what is your name?"}}
              - group: Parallel          # look at the person while they answer: the base turns to them; the answer ends it, and only both ending badly fails it
                success_count: 1
                failure_count: 2
                steps:
                  - {node: WaitForTranscript, ports: {out_text: "{${slot}_heard}"}}
                  - {node: FollowTarget, ports: {until_cancelled: "true", search: "false", timeout_ms: "12000"}}
              - {node: ExtractAnswer, ports: {kind: name, text: "{${slot}_heard}", out_value: "{${slot}_name}"}}
          - {node: Speak, ports: {text: "Sorry, please say only your name"}}
      - {node: Speak, ports: {text: "Hi {person}, welcome!", person: "{${slot}_name}"}}
      - group: Fallback
        retry: 2
        steps:
          - group: Sequence
            steps:
              - {node: Speak, ports: {text: "What is your favourite drink?"}}
              - group: Parallel          # look at the person while they answer: the base turns to them; the answer ends it, and only both ending badly fails it
                success_count: 1
                failure_count: 2
                steps:
                  - {node: WaitForTranscript, ports: {out_text: "{${slot}_heard}"}}
                  - {node: FollowTarget, ports: {until_cancelled: "true", search: "false", timeout_ms: "12000"}}
              - {node: ExtractAnswer, ports: {kind: drink, text: "{${slot}_heard}", out_value: "{${slot}_drink}"}}
          - {node: Speak, ports: {text: "Sorry, please say only the drink"}}
      - {node: Speak, ports: {text: "Your favourite drink is {detail}.", detail: "{${slot}_drink}"}}
      - {node: EnrollFace, ports: {person: "{${slot}_name}"}}


  register_person:
    description: "Ask the person in front of the camera who they are, repeat the name back and ask for a yes before enrolling their face under it, then welcome them (stays where it is; the person must face the camera); up to three tries; fails if no confirmed name or no face"
    steps:
      - group: Fallback
        retry: 3
        steps:
          - group: Sequence
            steps:
              - {node: Speak, ports: {text: "Hi, who are you? Please look at me."}}
              - {node: WaitForTranscript, ports: {out_text: "{reg_heard}"}}
              - {node: ExtractAnswer, ports: {kind: name, text: "{reg_heard}", out_value: "{reg_name}"}}
              - {node: Speak, ports: {text: "Is your name {person}? Please say yes or no.", person: "{reg_name}"}}
              - {node: WaitForTranscript, ports: {out_text: "{reg_reply}"}}
              - {node: ExtractAnswer, ports: {kind: "yes", text: "{reg_reply}"}}
          - group: Sequence       # nothing heard, no name, or "no": apologise, then FAIL so the retry asks again
            steps:
              - {node: Speak, ports: {text: "Sorry, let us try again."}}
              - {node: AlwaysFailure}
      - group: Fallback
        retry: 3
        steps:
          - {node: EnrollFace, ports: {person: "{reg_name}"}}
          - group: Sequence       # no face seen in the last 2 s: wait a second and try again
            steps:
              - {node: Sleep, ports: {msec: "1000"}}
              - {node: AlwaysFailure}
      - {node: Speak, ports: {text: "Hi {person}, welcome!", person: "{reg_name}"}}

  greet_or_register:
    description: "Find a person, make sure their face is in view (the camera is low: it backs away slowly until the face shows), then: a known face is greeted by name, a new face is asked its name (confirmed with a yes, enrolled, then welcomed by name)"
    steps:
      - {macro: find_person}
      - {macro: look_at_person}
      - group: Fallback          # a face in view; else back away until one is (fails if none after that)
        steps:
          - {node: ExtractFaceFeature}
          - group: Sequence
            steps:
              - {node: BackUpForFace}
              - {node: Sleep, ports: {msec: "500"}}
              - {node: ExtractFaceFeature}
          - group: Sequence
            steps:
              - {node: Speak, ports: {text: "I cannot see your face"}}
              - {node: AlwaysFailure}
      - group: Fallback
        steps:
          - group: Sequence       # a face the gallery knows
            steps:
              - {node: RecognizeFace}
              - {node: ExtractFaceFeature, ports: {out_identity: "{greet_name}"}}
              - {node: Speak, ports: {text: "Hello {person}, good to see you again", person: "{greet_name}"}}
          - {macro: register_person}


  describe_features:
    description: "Find a person, face them (backing away until the face shows) and say what is visible: the colour of their top and bottoms, then glasses, hair colour, hat, earrings. Colours and face attributes only; each is left out when not certain"
    steps:
      - {macro: find_person}
      - {macro: look_at_person}
      - group: Fallback          # best effort: a face in view makes the face attributes possible
        steps:
          - {node: ExtractFaceFeature}
          - group: Sequence
            steps:
              - {node: BackUpForFace}
              - {node: Sleep, ports: {msec: "500"}}
          - {node: AlwaysSuccess}
      - {node: DescribePerson, ports: {out_text: "{look}"}}
      - {node: Speak, ports: {text: "I see {person}", person: "{look}"}}
      - group: Fallback
        steps:
          - {node: DescribeAttributes, ports: {out_text: "{face_look}"}}
          - {node: AlwaysSuccess}
      - {node: Speak, ports: {text: "They are {detail}.", detail: "{face_look}", skip_if_unknown: "true"}}


  mates_visit:
    description: "Find My Mates, one checkpoint: go there, say it is scanning, find a person, walk up to them, ask their name and age, back away until the face shows and remember how they look (glasses, hair, else clothes colours); fails if nobody is there"
    params: {place: {required: true}, slot: {required: true}}
    example_args: {place: coffee_table, slot: guest1}
    steps:
      - {macro: go_to_place, args: {place: "${place}"}}
      - {node: Speak, ports: {text: "I am scanning for people here"}}
      - group: Fallback          # a person at the checkpoint: ahead, else a quarter turn each side (find_person would use more nodes than this budget allows)
        steps:
          - {node: DetectPerson}
          - group: Sequence
            steps:
              - {node: RotateBy, ports: {radians: "1.2"}}
              - {node: DetectPerson}
          - group: Sequence
            steps:
              - {node: RotateBy, ports: {radians: "-2.4"}}
              - {node: DetectPerson}
      - {macro: approach_person, args: {distance: "1.0"}}
      - {node: Speak, ports: {text: "Hello, I am looking at your features"}}
      - group: Fallback
        retry: 2
        steps:
          - group: Sequence
            steps:
              - {node: Speak, ports: {text: "What is your name?"}}
              - group: Parallel          # look at the person while they answer: the base turns to them; the answer ends it, and only both ending badly fails it
                success_count: 1
                failure_count: 2
                steps:
                  - {node: WaitForTranscript, ports: {out_text: "{${slot}_heard}"}}
                  - {node: FollowTarget, ports: {until_cancelled: "true", search: "false", timeout_ms: "12000"}}
              - {node: ExtractAnswer, ports: {kind: name, text: "{${slot}_heard}", out_value: "{${slot}_name}"}}
          - {node: Speak, ports: {text: "Sorry, please say only your name"}}
      - {node: Speak, ports: {text: "Nice to meet you {person}", person: "{${slot}_name}"}}
      - group: Fallback          # the age is a bonus detail: one try, then carry on without it
        steps:
          - group: Sequence
            steps:
              - {node: Speak, ports: {text: "How old are you?"}}
              - {node: WaitForTranscript, ports: {out_text: "{${slot}_heard}"}}
              - {node: ExtractAnswer, ports: {kind: age, text: "{${slot}_heard}", out_value: "{${slot}_age}"}}
          - {node: AlwaysSuccess}
      - group: Fallback          # the camera is low: a face needs distance; best effort
        steps:
          - {node: ExtractFaceFeature}
          - group: Sequence
            steps:
              - {node: BackUpForFace}
              - {node: Sleep, ports: {msec: "500"}}
          - {node: AlwaysSuccess}
      - {macro: note_look, args: {slot: "${slot}"}}
      - group: Fallback          # man or woman from the face (and the age if the guest did not say it): said in the report
        steps:
          - {node: DescribeWithVLM, ports: {out_gender: "{${slot}_gender}", out_text: "{${slot}_vlm}"}}
          - {node: EstimateGender, ports: {out_value: "{${slot}_gender}"}}
          - {node: AlwaysSuccess}
      - group: Fallback          # the stable id of this guest (to describe them later against everyone seen) and where they are
        steps:
          - {node: DescribeUnique, ports: {out_track_id: "{${slot}_id}", out_text: "{${slot}_look}"}}
          - {node: AlwaysSuccess}
      - group: Fallback
        steps:
          - {node: DescribeLocation, ports: {out_text: "{${slot}_where}"}}
          - {node: AlwaysSuccess}
      - group: Fallback          # remembering the face lets the Receptionist and later rounds know them; never a reason to fail
        steps:
          - {node: EnrollFace, ports: {person: "{${slot}_name}"}}
          - {node: AlwaysSuccess}


  mates_report:
    description: "Find My Mates: say what was found about one guest (name, where, how they look, age); says nothing about a guest that was not found. slot = the guest slot, where = a place phrase like 'near the coffee table'"
    params: {slot: {required: true}, where: {required: true}}
    example_args: {slot: guest1, where: near the coffee table}
    steps:
      - group: Fallback          # now that every guest has been seen, pick the features that tell THIS guest apart from the others
        steps:
          - {node: DescribeUnique, ports: {track_id: "{${slot}_id}", min_features: "3", out_text: "{${slot}_look}"}}
          - {node: AlwaysSuccess}
      - {node: Speak, ports: {text: "I found {person} ${where}.", person: "{${slot}_name}", skip_if_unknown: "true"}}
      - {node: Speak, ports: {text: "Guest {person} was {detail}.", person: "{${slot}_name}", detail: "{${slot}_where}", skip_if_unknown: "true"}}
      - {node: Speak, ports: {text: "Guest {person} is {detail}.", person: "{${slot}_name}", detail: "{${slot}_look}", skip_if_unknown: "true"}}
      - {node: Speak, ports: {text: "Guest {person} is a {detail}.", person: "{${slot}_name}", detail: "{${slot}_gender}", skip_if_unknown: "true"}}
      - {node: Speak, ports: {text: "Guest {person} is {detail} years old.", person: "{${slot}_name}", detail: "{${slot}_age}", skip_if_unknown: "true"}}


  mates_round:
    description: "RoboCup Education Find My Mates, started by the spoken start signal (do not use for anything else): visit up to three checkpoints (each: find a person, walk up, ask name and age, remember how they look), then go back to the operator (place start) and report every guest found with where and how they look. A checkpoint without a person is skipped, never retried"
    params: {cp1: {default: coffee_table}, cp1_words: {default: "near the coffee table"}, cp2: {default: dining_table}, cp2_words: {default: "near the dining table"}, cp3: {default: shelves}, cp3_words: {default: "near the shelves"}}
    example_args: {cp1: coffee_table, cp1_words: near the coffee table}
    steps:
      - {macro: say, args: {text: "Starting the task. I am finding your mates now."}}
      - group: Fallback
        steps:
          - {macro: mates_visit, args: {place: "${cp1}", slot: guest1}}
          - {macro: say, args: {text: "I found nobody there"}}
      - group: Fallback
        steps:
          - {macro: mates_visit, args: {place: "${cp2}", slot: guest2}}
          - {macro: say, args: {text: "I found nobody there"}}
      - group: Fallback
        steps:
          - {macro: mates_visit, args: {place: "${cp3}", slot: guest3}}
          - {macro: say, args: {text: "I found nobody there"}}
      - {macro: go_to_place, args: {place: start}}
      - {macro: say, args: {text: "I am back. Here is my report."}}
      - {macro: mates_report, args: {slot: guest1, where: "${cp1_words}"}}
      - {macro: mates_report, args: {slot: guest2, where: "${cp2_words}"}}
      - {macro: mates_report, args: {slot: guest3, where: "${cp3_words}"}}
      - {macro: say, args: {text: "That is all. Thank you."}}


  luggage_round:
    description: "Carry My Luggage, started by the spoken start signal (do not use for anything else): ask which bag, perceive the one the referee points at and say which, take the bag the operator hands over (skipped when the arm cannot), wait for the command follow me, follow the operator (obstacle avoiding, a lost operator is searched for) until THEY say stop / we are here or hold a hand up while standing still, give the bag back when they thank the robot, then try to drive back to the start place"
    params: {distance: {default: "1.0"}}
    example_args: {distance: "1.0"}
    steps:
      - {macro: say, args: {text: "Starting the task. Which bag should I carry? Please point at it."}}
      - group: Fallback          # wait up to 15 s for a pointing arm that lines up with a bag, then carry on either way
        steps:
          - group: Fallback
            retry: 10
            steps:
              - {node: PointedObject, ports: {out_place: "{bag_place}"}}
              - group: Sequence
                steps:
                  - {node: Sleep, ports: {msec: "1500"}}
                  - {node: AlwaysFailure}
          - {node: AlwaysSuccess}
      - {node: Speak, ports: {text: "I will take the {person}. Please hand me its handle.", person: "{bag_place}", skip_if_unknown: "true"}}
      - group: Fallback          # skip rule: no arm or no handover -> follow without the bag
        steps:
          - group: Sequence
            steps:
              - {node: OpenGripper}
              - {node: Speak, ports: {text: "Put the handle in my gripper and say ready."}}
              - {node: WaitForPhrase, ports: {words: "ready,done,take it", timeout_ms: "30000"}}
              - {node: CloseGripper}
          - {node: AlwaysSuccess}
      - {node: Speak, ports: {text: "I am ready. Say follow me when you want me to start following you."}}
      - group: Fallback          # only "follow me" starts the follow; after a minute and a half it starts anyway rather than stand there
        steps:
          - {node: WaitForPhrase, ports: {words: "follow me,follow me please,please follow me", timeout_ms: "90000"}}
          - {node: AlwaysSuccess}
      - {macro: follow_until_told, args: {distance: "${distance}", words: "stop,we are here,we have arrived,this is the car"}}
      - group: Fallback          # give the bag back only after the operator has taken hold of it (they say thank you): letting go earlier is a drop
        steps:
          - group: Sequence
            steps:
              - {node: Speak, ports: {text: "Here is your bag. Please take it."}}
              - {node: WaitForPhrase, ports: {words: "thank you,thanks,got it,i have it", timeout_ms: "20000"}}
              - {node: OpenGripper}
          - {node: AlwaysSuccess}
      - {macro: say, args: {text: "You are welcome. Going back to the arena."}}
      - group: Fallback          # bonus: back along the path the operator walked (no map outside the arena), then Nav2 on the arena map to the start
        steps:
          - group: Sequence
            steps:
              - {node: RetraceTrail, ports: {speed: "0.2"}}
              - group: Fallback
                steps:
                  - {macro: return_home}
                  - {node: AlwaysSuccess}
          - {macro: return_home}
          - {node: AlwaysSuccess}


  look_at_guest:
    description: "Turn the base to look at a remembered guest by name (the person whose recognised face has that name); never fails. slot = the guest slot"
    params: {slot: {default: guest1}}
    example_args: {slot: guest1}
    steps:
      - group: Fallback
        steps:
          - group: Sequence
            steps:
              - {node: FindPerson, ports: {who: "{${slot}_name}", out_track_id: "{look_id}"}}
              - {node: FollowTarget, ports: {track_id: "{look_id}", timeout_ms: "4000"}}
          - {node: AlwaysSuccess}


  describe_guest:
    description: "Say how a remembered guest looks, to the person in front of the robot, looking at that guest while doing it: at least the colour of the top and bottoms, hair colour, glasses and sitting or standing, using only features nobody else in the room shares (the stored look of the guest when the guest is not in view). slot = the guest slot"
    params: {slot: {default: guest1}}
    example_args: {slot: guest1}
    steps:
      - group: Fallback
        steps:
          - group: Sequence
            steps:
              - {node: FindPerson, ports: {who: "{${slot}_name}", out_track_id: "{look_id}"}}
              - group: Fallback
                steps:
                  - {node: FollowTarget, ports: {track_id: "{look_id}", timeout_ms: "4000"}}
                  - {node: AlwaysSuccess}
              - {node: DescribeUnique, ports: {track_id: "{look_id}", min_features: "4", out_text: "{${slot}_full}"}}
              - {node: Speak, ports: {text: "Guest {person} is {detail}.", person: "{${slot}_name}", detail: "{${slot}_full}", skip_if_unknown: "true"}}
          - {macro: tell_look, args: {slot: "${slot}"}}
      - {node: Speak, ports: {text: "Guest {person} is a {detail}.", person: "{${slot}_name}", detail: "{${slot}_gender}", skip_if_unknown: "true"}}
      - {node: Speak, ports: {text: "Guest {person} is {detail} years old.", person: "{${slot}_name}", detail: "{${slot}_age}", skip_if_unknown: "true"}}


  introduce_guest:
    description: "Say the name and favourite drink remembered for a slot (see meet_guest), e.g. to the host"
    params: {slot: {default: guest1}}
    example_args: {slot: guest1}
    steps:
      - {node: Speak, ports: {text: "This is {person}", person: "{${slot}_name}"}}
      - {node: Speak, ports: {text: "Their favourite drink is {person}", person: "{${slot}_drink}"}}

  patrol_laps:
    description: "Patrol between two named places a number of times ('patrol N times', 'N laps'); laps is a plain whole number 1-10 such as \"4\""
    params: {first: {required: true}, second: {required: true}, laps: {default: "2"}}
    example_args: {first: left_room, second: right_room, laps: "3"}
    steps:
      - group: Sequence
        repeat: "${laps}"
        steps:
          - {macro: go_to_place, args: {place: "${first}"}}
          - {macro: go_to_place, args: {place: "${second}"}}

  wait_for_doorbell:
    description: "Wait for the doorbell / when someone rings the bell (listens for a steady tone, up to 60 s) and say that someone is at the door; fails if it never rings"
    steps:
      - {node: DetectSound, ports: {kind: doorbell, timeout_ms: "60000"}}
      - {macro: say, args: {text: "Someone is at the door"}}

  offer_seat:
    description: "Look for a free seat (chair, couch, bench), turning up to three quarter turns, and tell the guest to sit there and on which side it is; fails if none is found"
    steps:
      - group: Fallback
        steps:
          - {node: FindFreeSeat, ports: {out_place: "{seat_where}", out_radians: "{seat_rad}"}}
          - group: Sequence
            steps:
              - {node: RotateBy, ports: {radians: "1.57"}}
              - {node: FindFreeSeat, ports: {out_place: "{seat_where}", out_radians: "{seat_rad}"}}
          - group: Sequence
            steps:
              - {node: RotateBy, ports: {radians: "1.57"}}
              - {node: FindFreeSeat, ports: {out_place: "{seat_where}", out_radians: "{seat_rad}"}}
          - group: Sequence
            steps:
              - {node: Speak, ports: {text: "I cannot see a free seat"}}
              - {node: AlwaysFailure}
      - group: Fallback          # face the seat while offering it
        steps:
          - {node: RotateBy, ports: {radians: "{seat_rad}"}}
          - {node: AlwaysSuccess}
      - group: Fallback          # and point at it with the arm (enable_arm; the rules say the seat must be pointed at): the nearest safe pose, not the validated 0.03 rad/s
        steps:
          - {node: ArmPoint}
          - {node: AlwaysSuccess}
      - {node: Speak, ports: {text: "Please sit on the {person}", person: "{seat_where}"}}
      - group: Fallback
        steps:
          - {node: ArmPark, ports: {rate: "0.08"}}
          - {node: AlwaysSuccess}

  note_look:
    description: "Remember what is visible about the guest in front of the camera (glasses, hair colour, hat, earrings; else the colour of the top) under a slot, to tell it later; silent, and succeeds when nothing is certain"
    params: {slot: {default: guest1}}
    example_args: {slot: guest1}
    steps:
      - group: Fallback
        steps:
          - {node: DescribeAttributes, ports: {out_text: "{${slot}_look}"}}
          - {node: DescribePerson, ports: {out_text: "{${slot}_look}"}}
          - {node: AlwaysSuccess}

  tell_look:
    description: "Say what was remembered with note_look about a guest, to another person ('Alice is wearing glasses'); says nothing when nothing was certain"
    params: {slot: {default: guest1}}
    example_args: {slot: guest1}
    steps:
      - {node: Speak, ports: {text: "By the way, {person} is {detail}.", person: "{${slot}_name}", detail: "{${slot}_look}", skip_if_unknown: "true"}}

  introduce_to:
    description: "Face the nearest person and introduce a remembered guest to them by name and favourite drink (who = the name to greet, e.g. the host)"
    params: {slot: {default: guest1}, who: {default: host}}
    example_args: {slot: guest1, who: John}
    steps:
      - group: Fallback
        steps:
          - {macro: look_at_person}
          - {node: AlwaysSuccess}
      - {node: Speak, ports: {text: "Hello ${who}. This is {person}.", person: "{${slot}_name}"}}
      - {node: Speak, ports: {text: "Their favourite drink is {person}", person: "{${slot}_drink}"}}

  receive_guest:
    description: "Go to the door and wait there for a guest to step up to the robot (within 2.5 m) or ring the bell (up to 3 minutes), welcome them, face them (backing away until the face shows), ask name and favourite drink (said back), remember how they look and, from the face, whether they are a man or a woman and about how old; slot = guest1, guest2 ..."
    params: {slot: {default: guest1}}
    example_args: {slot: guest1}
    steps:
      - {macro: go_to_place, args: {place: door}}
      - group: Parallel          # the door is open by default and the guest steps up to the robot; the bell only rings when it is closed
        success_count: 1
        steps:
          - {node: DetectSound, ports: {kind: doorbell, timeout_ms: "180000"}}
          - group: Fallback
            retry: 180
            steps:
              - {node: DetectPerson, ports: {max_distance: "2.5"}}
              - group: Sequence
                steps:
                  - {node: Sleep, ports: {msec: "1000"}}
                  - {node: AlwaysFailure}
      - {node: Speak, ports: {text: "Welcome, please come in"}}
      - group: Fallback
        steps:
          - {node: DetectPerson}
          - {node: AlwaysSuccess}
      - group: Fallback          # the camera is low: a face needs distance; back away until it shows (best effort)
        steps:
          - {node: ExtractFaceFeature}
          - group: Sequence
            steps:
              - {node: BackUpForFace}
              - {node: Sleep, ports: {msec: "500"}}
          - {node: AlwaysSuccess}
      - {macro: meet_guest, args: {slot: "${slot}"}}
      - group: Fallback          # he / she / they and the age for the introduction and the description (from a vision-language model, else the face model; says they when unsure)
        steps:
          - {node: DescribeWithVLM, ports: {out_gender: "{${slot}_gender}", out_pronoun: "{${slot}_pron}", out_age: "{${slot}_age}"}}
          - {node: EstimateGender, ports: {out_value: "{${slot}_gender}", out_pronoun: "{${slot}_pron}", out_age: "{${slot}_age}"}}
          - {node: AlwaysSuccess}
      - {macro: note_look, args: {slot: "${slot}"}}


  introduce_new_guest:
    description: "A new guest has been led into the room: turn to the host and say 'Hi <host>, this is <guest>, he/she likes to drink <drink>' (he or she from the face), say hello to everyone else, then tell the guest who the host is and what the host likes to drink. slot = the guest slot; host, host_drink, host_pron (he / she) = the fixed host facts announced before the test"
    params: {slot: {default: guest1}, host: {default: host}, host_drink: {default: water}, host_pron: {default: he}}
    example_args: {slot: guest1, host: John, host_drink: milk, host_pron: he}
    steps:
      - group: Fallback          # look at the host: the face the gallery knows under the host's name, else the nearest person
        steps:
          - group: Sequence
            steps:
              - {node: FindPerson, ports: {who: "${host}", out_track_id: "{host_id}"}}
              - {node: FollowTarget, ports: {track_id: "{host_id}", timeout_ms: "4000"}}
          - group: Sequence
            steps:
              - {node: DetectPerson}
              - {node: FollowTarget, ports: {timeout_ms: "4000"}}
          - {node: AlwaysSuccess}
      - {node: Speak, ports: {text: "Hi ${host}, this is {person}. {pron} likes to drink {detail}.", person: "{${slot}_name}", pron: "{${slot}_pron}", detail: "{${slot}_drink}"}}
      - {node: Speak, ports: {text: "Hello everyone, this is {person}.", person: "{${slot}_name}"}}
      - {macro: look_at_guest, args: {slot: "${slot}"}}
      - {node: Speak, ports: {text: "Hi {person}, this is ${host}. {pron} likes to drink {detail}.", person: "{${slot}_name}", pron: "${host_pron}", detail: "${host_drink}"}}


  introduce_pair:
    description: "Two guests already in the room: introduce each to the other by name, he/she and favourite drink, looking at the one being addressed. a and b = their slots"
    params: {a: {default: guest1}, b: {default: guest2}}
    example_args: {a: guest1, b: guest2}
    steps:
      - {macro: look_at_guest, args: {slot: "${b}"}}
      - {node: Speak, ports: {text: "Hi {person}, I would like to introduce you to {detail}.", person: "{${b}_name}", detail: "{${a}_name}"}}
      - {node: Speak, ports: {text: "Note that {pron} likes to drink {detail}.", pron: "{${a}_pron}", detail: "{${a}_drink}"}}
      - {macro: look_at_guest, args: {slot: "${a}"}}
      - {node: Speak, ports: {text: "Hi {person}, I would like to introduce you to {detail}.", person: "{${a}_name}", detail: "{${b}_name}"}}
      - {node: Speak, ports: {text: "Note that {pron} likes to drink {detail}.", pron: "{${b}_pron}", detail: "{${b}_drink}"}}


  enroll_host:
    description: "SETUP, before the test: the host sits in front of the camera and the face is stored under the host's name, so the robot can find and look at the host later (fixed name, fixed face). host = the name announced before the test"
    params: {host: {required: true}}
    example_args: {host: John}
    steps:
      - {node: Speak, ports: {text: "Host, please look at me so that I can remember your face."}}
      - group: Fallback
        retry: 5
        steps:
          - {node: EnrollFace, ports: {person: "${host}"}}
          - group: Sequence
            steps:
              - {node: Sleep, ports: {msec: "1000"}}
              - {node: AlwaysFailure}
      - {node: Speak, ports: {text: "Thank you ${host}, I will remember you."}}


  hric_round:
    description: "Use ALONE for the whole receptionist task (it already receives both guests, introduces and seats them; never add receive_guest or offer_seat around it): at the door ask the guest's name and drink, say follow me and lead them into the living room, introduce them to the host (fixed name, face and drink) and everyone, introduce the host to them, offer a free seat and say which; the second guest is also introduced to the first and the other way round, and guest 1 is described to guest 2. host, host_drink, host_pron (he / she) = the host announced before the test, living_place = where the host and the seats are"
    params: {host: {default: host}, host_drink: {default: water}, host_pron: {default: he}, living_place: {default: living_room}}
    example_args: {host: John, host_drink: milk, host_pron: he, living_place: living_room}
    steps:
      - {node: Speak, ports: {text: "Starting the task. I am waiting for the first guest at the door."}}
      - {macro: receive_guest, args: {slot: guest1}}
      - {macro: guide_to, args: {place: "${living_place}"}}
      - {macro: introduce_new_guest, args: {slot: guest1, host: "${host}", host_drink: "${host_drink}", host_pron: "${host_pron}"}}
      - {macro: offer_seat}
      - {macro: receive_guest, args: {slot: guest2}}
      - {macro: guide_to, args: {place: "${living_place}"}}
      - {macro: introduce_new_guest, args: {slot: guest2, host: "${host}", host_drink: "${host_drink}", host_pron: "${host_pron}"}}
      - {macro: introduce_pair, args: {a: guest1, b: guest2}}
      - {macro: describe_guest, args: {slot: guest1}}
      - {macro: offer_seat}
      - {node: Speak, ports: {text: "The task is finished. Thank you."}}


  follow_until_told:
    description: "Follow a person (obstacle avoiding, along the path they walked, locked to the first person seen) and keep following until THEY tell it to stop (the word stop / we are here, or a raised hand) while they stand still: a stop from anyone else or while they walk is ignored; a person who disappears is looked for where they were last seen, then if still lost it looks again (3 tries). distance = gap in metres (min 0.5)"
    params: {distance: {default: "1.0"}, words: {default: "stop,we are here,we have arrived"}}
    example_args: {distance: "1.0"}
    steps:
      - {macro: say, args: {text: "I will follow you. Say stop when we have arrived."}}
      - group: Sequence
        retry: 3
        steps:
          - {macro: find_person}
          - group: Parallel
            success_count: 1
            steps:
              - {node: FollowTarget, ports: {approach: "true", distance: "${distance}", until_cancelled: "true", lock: "true", trail: "true", timeout_ms: "900000"}}
              - {node: WaitForStop, ports: {words: "${words}", timeout_ms: "900000"}}
      - {macro: say, args: {text: "Okay, I stop here."}}


  help_me_carry:
    description: "Help Me Carry: follow the operator until they say stop (obstacle avoiding), then drive back to the start place"
    params: {distance: {default: "1.0"}}
    example_args: {distance: "1.0"}
    steps:
      - {macro: follow_until_told, args: {distance: "${distance}"}}
      - {macro: say, args: {text: "Going back to the start"}}
      - {macro: return_home}

  find_waving_person:
    description: "Look around (turning on the spot, about two full turns) until somebody waves; fails if nobody does"
    steps:
      - group: Fallback
        retry: 24
        steps:
          - {node: IsPersonWaving}
          - group: Sequence
            steps:
              - {node: RotateBy, ports: {radians: "0.5"}}
              - {node: Sleep, ports: {msec: "1500"}}
              - {node: AlwaysFailure}

  assist_waving_person:
    description: "Find somebody who waves for help, walk up to them and ask how to help; what they answer becomes the next task"
    steps:
      - {macro: find_waving_person}
      - {macro: approach_person}
      - {macro: say, args: {text: "Hello, how can I help you?"}}

  take_order:
    description: "Ask a customer what they want, repeat it back and ask for a yes before accepting it (up to 3 tries); remembers it under a slot (customer1, customer2...)"
    params: {slot: {default: customer1}}
    example_args: {slot: customer1}
    steps:
      - group: Fallback
        retry: 3
        steps:
          - group: Sequence
            steps:
              - {node: Speak, ports: {text: "Hello, what would you like to order?"}}
              - {node: WaitForTranscript, ports: {out_text: "{${slot}_order}"}}
              - {node: Speak, ports: {text: "You would like: {person}. Is that right? Please say yes or no.", person: "{${slot}_order}"}}
              - {node: WaitForTranscript, ports: {out_text: "{${slot}_reply}"}}
              - {node: ExtractAnswer, ports: {kind: "yes", text: "{${slot}_reply}"}}
          - group: Sequence
            steps:
              - {node: Speak, ports: {text: "Sorry, let us try again."}}
              - {node: AlwaysFailure}
      - {node: Speak, ports: {text: "Thank you, I will pass on your order."}}

  tell_order:
    description: "Say aloud the order remembered with take_order (to the barman at the counter)"
    params: {slot: {default: customer1}}
    example_args: {slot: customer1}
    steps:
      - {node: Speak, ports: {text: "New order: {person}.", person: "{${slot}_order}", skip_if_unknown: "true"}}

  restaurant_round:
    description: "Restaurant for two customers: wait for a customer to wave, walk up, take and confirm the order, go back to the counter and tell it, then the same for the second customer (fetching and serving the items needs the arm)"
    steps:
      - {macro: find_waving_person}
      - {macro: approach_person}
      - {macro: take_order, args: {slot: customer1}}
      - {macro: return_home}
      - {macro: tell_order, args: {slot: customer1}}
      - {macro: find_waving_person}
      - {macro: approach_person}
      - {macro: take_order, args: {slot: customer2}}
      - {macro: return_home}
      - {macro: tell_order, args: {slot: customer2}}

  # ---- arm tasks (the arm extension does nothing live until `live: true`; objects come from the arm eye, tools/arm/arm_eye.sh) ----
  dispose_rubbish:
    description: "Pick up rubbish the ARM EYE sees in front of the robot and put it in the dustbin (one item per round, rounds = how many, default 1); quietly does nothing when no rubbish is in view"
    params: {rounds: {default: "1"}}
    example_args: {rounds: "1"}
    steps:
      - group: Sequence
        repeat: "${rounds}"
        steps:
          - group: Fallback
            steps:
              - group: Sequence
                steps:
                  - {node: NextObject, ports: {task: rubbish, out_label: "{obj}", out_nav: "{nav}", out_put: "{put}"}}
                  - {macro: pick_object, args: {label: "{obj}"}}
                  - {macro: go_to_place, args: {place: "{nav}"}}
                  - {macro: put_down, args: {place: "{put}"}}
              - {node: AlwaysSuccess}

  clean_the_table_round:
    description: "Clean the Table: drive to the table (table_place), then for each object the arm eye sees pick it, take it to its place (waste -> dustbin, kitchenware -> dishwasher) and come back, up to rounds objects (default 6)"
    params: {table_place: {required: true}, rounds: {default: "6"}}
    example_args: {table_place: left_room, rounds: "6"}
    steps:
      - {macro: go_to_place, args: {place: "${table_place}"}}
      - group: Sequence
        repeat: "${rounds}"
        steps:
          - group: Fallback
            steps:
              - group: Sequence
                steps:
                  - {node: NextObject, ports: {task: clean_table, out_label: "{obj}", out_nav: "{nav}", out_put: "{put}"}}
                  - {macro: pick_object, args: {label: "{obj}"}}
                  - {macro: go_to_place, args: {place: "{nav}"}}
                  - {macro: put_down, args: {place: "{put}"}}
                  - {node: Speak, ports: {text: "I put the {person} away.", person: "{obj}", skip_if_unknown: "true"}}
                  - {macro: go_to_place, args: {place: "${table_place}"}}
              - {node: AlwaysSuccess}
      - {macro: say, args: {text: "I have finished cleaning the table"}}

  store_groceries_round:
    description: "Storing Groceries: drive to the table with the groceries (table_place), then for each item the arm eye sees pick it and put it on the shelf (saying which group it belongs to) and come back, up to rounds items (default 6)"
    params: {table_place: {required: true}, rounds: {default: "6"}}
    example_args: {table_place: left_room, rounds: "6"}
    steps:
      - {macro: go_to_place, args: {place: "${table_place}"}}
      - group: Sequence
        repeat: "${rounds}"
        steps:
          - group: Fallback
            steps:
              - group: Sequence
                steps:
                  - {node: NextObject, ports: {task: groceries, out_label: "{obj}", out_nav: "{nav}", out_put: "{put}", out_group: "{grp}"}}
                  - {macro: pick_object, args: {label: "{obj}"}}
                  - {macro: go_to_place, args: {place: "{nav}"}}
                  - {macro: put_down, args: {place: "{put}"}}
                  - {node: Speak, ports: {text: "I stored the {person} with the other {detail}.", person: "{obj}", detail: "{grp}", skip_if_unknown: "true"}}
                  - {macro: go_to_place, args: {place: "${table_place}"}}
              - {node: AlwaysSuccess}
      - {macro: say, args: {text: "I have stored the groceries"}}

  give_me_a_hand_round:
    description: "Give Me a Hand: hold the gripper open at the handover point, wait until the person says ready, close on the object, ask where it goes (table, shelf or bin) and put it there. The person decides when the gripper closes"
    params: {x: {default: "0.22"}, y: {default: "0.0"}, z: {default: "0.12"}}
    example_args: {x: "0.22", y: "0.0", z: "0.12"}
    steps:
      - {macro: say, args: {text: "Please hold the object in front of my gripper, then say ready"}}
      - group: Fallback
        steps:
          - group: Sequence
            steps:
              - {node: OpenGripper}
              - {node: MoveArmToPose, ports: {x: "${x}", y: "${y}", z: "${z}"}}
          - group: Sequence
            steps:
              - {node: Speak, ports: {text: "I cannot reach the handover point"}}
              - {node: AlwaysFailure}
      - {node: WaitForPhrase, ports: {words: "ready,okay,now,go ahead,got it", timeout_ms: "30000"}}
      - group: Fallback
        steps:
          - {node: CloseGripper}
          - group: Sequence
            steps:
              - {node: Speak, ports: {text: "I did not get it"}}
              - {node: OpenGripper}
              - {node: AlwaysFailure}
      - {macro: say, args: {text: "Thank you. Where shall I put it: table, shelf or bin?"}}
      - group: Fallback
        retry: 2
        steps:
          - group: Sequence
            steps:
              - {node: WaitForTranscript, ports: {out_text: "{hand_heard}"}}
              - {node: ExtractAnswer, ports: {kind: place, text: "{hand_heard}", out_value: "{hand_where}"}}
          - group: Sequence
            steps:
              - {node: Speak, ports: {text: "Please say table, shelf or bin"}}
              - {node: AlwaysFailure}
      - {macro: go_to_place, args: {place: "{hand_where}"}}
      - {macro: put_down, args: {place: "{hand_where}"}}

  egpsr_round:
    description: "Enhanced GPSR: bin any rubbish the arm eye sees, then look for somebody who waves for help, walk up and ask what they need (the answer becomes the next task)"
    steps:
      - {macro: dispose_rubbish}
      - {macro: assist_waving_person}

  # ---- walking around ----
  wander:
    description: "Walk around: drive about half a metre, turn a little, repeated for a number of legs (1-10). Stops for obstacles (lidar guard) and turns away instead"
    params: {legs: {default: "4"}}
    example_args: {legs: "3"}
    steps:
      - group: Sequence
        repeat: "${legs}"
        steps:
          - group: Fallback
            steps:
              - {node: DriveDistance, ports: {meters: "0.5"}}
              - {node: RotateBy, ports: {radians: "1.6"}}      # blocked: turn away, the next leg tries again
          - {node: RotateBy, ports: {radians: "0.5"}}

  wander_until_person:
    description: "Look for a person; if none is in view, walk a leg and look again, up to a number of tries (1-10); fails if nobody is found"
    params: {tries: {default: "5"}}
    example_args: {tries: "3"}
    steps:
      - group: Fallback
        retry: "${tries}"
        steps:
          - {node: DetectPerson}
          - group: Sequence
            steps:
              - {macro: wander, args: {legs: "1"}}
              - {node: AlwaysFailure}

  count_objects_at:
    description: "Go to a named place and say how many objects with this label (detector label) are seen there ('how many cups are on the dining table')"
    params: {place: {required: true}, label: {required: true}}
    example_args: {place: dining_table, label: cup}
    steps:
      - {macro: go_to_place, args: {place: "${place}"}}
      - {node: CountObjects, ports: {label: "${label}", out_count: "{n}"}}
      - {node: Speak, ports: {person: "{n}", text: "I see {person} ${label}"}}

  count_people_at:
    description: "Go to a named place and say how many people are seen there ('how many people are in the kitchen'); counts everybody, with no filter by pose"
    params: {place: {required: true}}
    example_args: {place: kitchen}
    steps:
      - {macro: go_to_place, args: {place: "${place}"}}
      - {node: CountPeople, ports: {out_count: "{n}"}}
      - {node: Speak, ports: {person: "{n}", text: "I see {person} people"}}

  count_people_wearing_at:
    description: "Go to a named place and say how many people wear a top of this colour ('how many people in the kitchen wear red'); colour is one of black, white, grey, red, orange, yellow, green, cyan, blue, purple, pink"
    params: {place: {required: true}, colour: {required: true}}
    example_args: {place: kitchen, colour: red}
    steps:
      - {macro: go_to_place, args: {place: "${place}"}}
      - {node: CountPeople, ports: {colour: "${colour}", out_count: "{n}"}}
      - {node: Speak, ports: {person: "{n}", text: "I see {person} people wearing ${colour}"}}

  tell_extreme_object_at:
    description: "Go to a named place and say which object there is the biggest, largest, smallest or thinnest (property); weight (heaviest, lightest) cannot be measured"
    params: {place: {required: true}, property: {required: true}}
    example_args: {place: shelves, property: biggest}
    steps:
      - {macro: go_to_place, args: {place: "${place}"}}
      - {node: FindExtremeObject, ports: {property: "${property}", out_label: "{x}"}}
      - {node: Speak, ports: {detail: "{x}", text: "The ${property} object is the {detail}"}}

  scout_room:
    description: "Turn a full circle in quarter turns and say how many people are seen at each stop"
    steps:
      - group: Sequence
        repeat: "4"
        steps:
          - {node: RotateBy, ports: {radians: "1.57"}}
          - {node: CountPeople, ports: {out_count: "{n}"}}
          - {node: Speak, ports: {text: "I see {person} people", person: "{n}"}}

  describe_person:
    description: "Find a person and say what colour top they are wearing (a description of the guest by their clothes)"
    steps:
      - {macro: find_person}
      - {node: DescribePerson, ports: {out_text: "{look}"}}
      - {node: Speak, ports: {text: "I see {person}", person: "{look}"}}

  announce_and_go:
    description: "Say a sentence while driving to a named place (both at the same time)"
    params: {place: {required: true}, text: {required: true}}
    example_args: {place: door, text: "On my way"}
    steps:
      - group: Parallel
        success_count: "2"
        steps:
          - {macro: go_to_place, args: {place: "${place}"}}
          - {macro: say, args: {text: "${text}"}}
