# Macros: named step lists the LLM can call as {"macro": "<name>", "args": {...}} instead of writing
# every node (fewer tokens = faster plans). Expanded in plain code before the SLM / rule generator;
# Tests expand and validate every macro here against the real node catalog
# (src/bt_validator/test/test_macro_library.py), so a typo in a node or port fails the build.
#   params: name -> {required: true | default: "..."}   (values are strings; ${name} in any value)
#   example_args: used by the test. A macro may call other macros (max depth 4, no cycles).
# Whitelist: the ONLY macros a task spec (LLM / SLM) may call; the validator's catalog, the LLM's JSON schema and the
# orchestrator all honour it. Macros may still call any macro inside their own steps. Remove a name to hide it.
whitelist:
  - say
  - go_to_place
  - go_and_say
  - patrol
  - turn_around
  - greet_person
  - approach_person
  - wave_back
  - report_object
  - return_home
  - look_around
  - find_person
  - find_object
  - pick_object
  - put_down
  - move_object
  - go_find_object
  - go_find_person
  - go_find_and_say
  - meet_and_remember
  - follow_person
  - look_at_person
  - acknowledge_person
  - meet_guest
  - register_person
  - introduce_guest
  - patrol_laps
  - wait_for_doorbell
  - offer_seat
  - receive_guest
  - hric_round
  - follow_until_told
  - help_me_carry
  - introduce_to
  - find_waving_person
  - assist_waving_person
  - take_order
  - tell_order
  - restaurant_round
  - dispose_rubbish
  - clean_the_table_round
  - store_groceries_round
  - give_me_a_hand_round
  - egpsr_round
  - note_look
  - tell_look
  - wander
  - wander_until_person
  - scout_room
  - count_objects_at
  - count_people_at
  - count_people_wearing_at
  - tell_extreme_object_at
  - describe_person
  - announce_and_go
  - guide_to
  - escort_person_to
  - wait_for_wave
  - stop_and_wait
  - ask_and_repeat

macros:
  say:
    description: "Say one short sentence"
    params: {text: {required: true}}
    example_args: {text: "Hello"}
    steps:
      - {node: Speak, ports: {text: "${text}"}}

  go_to_place:
    description: "Drive to a named place from places.yaml; if blocked, clear the costmaps and try once more"
    params: {place: {required: true}}
    example_args: {place: door}
    steps:
      - group: Fallback
        steps:
          - {node: NavigateToPlace, ports: {place: "${place}"}}
          - group: Sequence
            steps:
              - {node: ClearCostmaps}
              - {node: NavigateToPlace, ports: {place: "${place}"}}

  go_and_say:
    description: "Drive to a named place, then say a sentence there"
    params: {place: {required: true}, text: {required: true}}
    example_args: {place: door, text: "I have arrived"}
    steps:
      - {macro: go_to_place, args: {place: "${place}"}}
      - {macro: say, args: {text: "${text}"}}

  patrol:
    description: "Visit two named places in order"
    params: {first: {required: true}, second: {required: true}}
    example_args: {first: left_room, second: right_room}
    steps:
      - {macro: go_to_place, args: {place: "${first}"}}
      - {macro: go_to_place, args: {place: "${second}"}}

  turn_around:
    description: "Rotate in place by half a turn"
    steps:
      - {node: RotateBy, ports: {radians: "3.14"}}

  greet_person:
    description: "Wait for a person, recognise the face and greet them by name (unknown -> there); keeps trying about 30 rounds"
    steps:
      - group: Fallback
        retry: 30
        steps:
          - group: Sequence
            steps:
              - {node: DetectPerson, ports: {min_conf: "0.5"}}
              - {node: ExtractFaceFeature, ports: {min_conf: "0.5", out_identity: "{who}", out_similarity: "{sim}"}}
              - {node: Speak, ports: {text: "Hello {person}", person: "{who}"}}
          - group: Sequence
            steps:
              - {node: Sleep, ports: {msec: "200"}}
              - {node: AlwaysFailure}

  approach_person:
    description: "Find a person and walk up to them, stopping at a stand-off distance in metres (min 0.5)"
    params: {distance: {default: "1.0"}}
    steps:
      - {node: DetectPerson}
      - {node: FollowTarget, ports: {approach: "true", distance: "${distance}"}}

  wave_back:
    description: "If a person is waving, say hello to them"
    steps:
      - {node: IsPersonWaving}
      - {node: Speak, ports: {text: "Hello!"}}

  report_object:
    description: "Do you see a <object>? Look for an object (label from the detector's list), turning once if not seen, and say what was found"
    params: {label: {required: true}}
    example_args: {label: person}
    steps:
      - group: Fallback
        steps:
          - group: Sequence
            steps:
              - {node: DetectObject, ports: {label: "${label}"}}
              - {node: Speak, ports: {text: "I can see a ${label}"}}
          - group: Sequence
            steps:
              - {node: RotateBy, ports: {radians: "1.57"}}
              - {node: DetectObject, ports: {label: "${label}"}}
              - {node: Speak, ports: {text: "I can see a ${label} now"}}
          - {node: Speak, ports: {text: "I cannot see a ${label}"}}

  # ---- batch A: built only from nodes that exist today (see notes/MACROS_PLAN.md) ----
  return_home:
    description: "Drive back to the start place (only when asked to go home or return)"
    steps:
      - {macro: go_to_place, args: {place: start}}

  look_around:
    description: "Turn a full circle in four quarter turns (no detection, use before find_*)"
    steps:
      - {node: RotateBy, ports: {radians: "1.57"}}
      - {node: RotateBy, ports: {radians: "1.57"}}
      - {node: RotateBy, ports: {radians: "1.57"}}
      - {node: RotateBy, ports: {radians: "1.57"}}

  find_person:
    description: "Look for a person, turning up to three quarter turns; says so and FAILS if nobody is seen"
    steps:
      - group: Fallback
        steps:
          - {node: DetectPerson}
          - group: Sequence
            steps:
              - {node: RotateBy, ports: {radians: "1.57"}}
              - {node: DetectPerson}
          - group: Sequence
            steps:
              - {node: RotateBy, ports: {radians: "1.57"}}
              - {node: DetectPerson}
          - group: Sequence
            steps:
              - {node: RotateBy, ports: {radians: "1.57"}}
              - {node: DetectPerson}
          - group: Sequence
            steps:
              - {node: Speak, ports: {text: "I cannot find anyone"}}
              - {node: AlwaysFailure}

  find_object:
    description: "Only look for an object (detector label), turning up to three quarter turns; says so and FAILS if not seen; it never picks up or carries"
    params: {label: {required: true}}
    example_args: {label: person}
    steps:
      - group: Fallback
        steps:
          - {node: DetectObject, ports: {label: "${label}"}}
          - group: Sequence
            steps:
              - {node: RotateBy, ports: {radians: "1.57"}}
              - {node: DetectObject, ports: {label: "${label}"}}
          - group: Sequence
            steps:
              - {node: RotateBy, ports: {radians: "1.57"}}
              - {node: DetectObject, ports: {label: "${label}"}}
          - group: Sequence
            steps:
              - {node: RotateBy, ports: {radians: "1.57"}}
              - {node: DetectObject, ports: {label: "${label}"}}
          - group: Sequence
            steps:
              - {node: Speak, ports: {text: "I cannot find the ${label}"}}
              - {node: AlwaysFailure}

  pick_object:
    description: "Pick up an object (detector label) that the arm camera sees right here; says so and FAILS if it cannot. The robot then holds it"
    params: {label: {required: true}}
    example_args: {label: cup}
    steps:
      - group: Fallback
        steps:
          - {node: PickObject, ports: {label: "${label}"}}
          - group: Sequence
            steps:
              - {node: Speak, ports: {text: "I could not pick up the ${label}"}}
              - {node: AlwaysFailure}

  put_down:
    description: "Put the object being held down at a named arm place (table, shelf, bin), let go, and fold the arm away"
    params: {place: {required: true}}
    example_args: {place: table}
    steps:
      - group: Fallback
        steps:
          - group: Sequence
            steps:
              - {node: PlaceObject, ports: {place: "${place}"}}
              - {node: ArmPark}
          - group: Sequence
            steps:
              - {node: Speak, ports: {text: "I could not put it down at the ${place}"}}
              - {node: AlwaysFailure}

  move_object:
    description: "Take an object from one place to another: go to from_place, pick the object up, go to to_place, put it down at the arm place put_place (table, shelf, bin)"
    params: {label: {required: true}, from_place: {required: true}, to_place: {required: true}, put_place: {required: true}}
    example_args: {label: cup, from_place: kitchen, to_place: door, put_place: table}
    steps:
      - {macro: go_to_place, args: {place: "${from_place}"}}
      - {macro: pick_object, args: {label: "${label}"}}
      - {macro: go_to_place, args: {place: "${to_place}"}}
      - {macro: put_down, args: {place: "${put_place}"}}

  go_find_object:
    description: "Go to a named place and only look for an object there (never picks up, takes or brings it)"
    params: {place: {required: true}, label: {required: true}}
    example_args: {place: door, label: person}
    steps:
      - {macro: go_to_place, args: {place: "${place}"}}
      - {macro: find_object, args: {label: "${label}"}}

  go_find_person:
    description: "Go to a named place and look for a person there"
    params: {place: {required: true}}
    example_args: {place: door}
    steps:
      - {macro: go_to_place, args: {place: "${place}"}}
      - {macro: find_person}

  go_find_and_say:
    description: "Go to a place, find a person, walk up to them and say a sentence"
    params: {place: {required: true}, text: {required: true}}
    example_args: {place: door, text: "Hello"}
    steps:
      - {macro: go_find_person, args: {place: "${place}"}}
      - {macro: approach_person}
      - {macro: say, args: {text: "${text}"}}

  meet_and_remember:
    description: "Walk up to a person, store their face under a name (A-Z a-z 0-9 _ -) and greet them"
    params: {name: {required: true}}
    example_args: {name: alice}
    steps:
      - {macro: approach_person}
      - {node: EnrollFace, ports: {person: "${name}"}}
      - {node: Speak, ports: {text: "Nice to meet you ${name}"}}

  follow_person:
    description: "Follow me / come with me / walk behind a person: find a person and follow them at a distance in metres (min 0.5); a person who disappears is looked for where they were last seen, and if still lost it turns a little, looks again and retries up to 3 times"
    params: {distance: {default: "1.0"}}
    steps:
      - {macro: find_person}
      - group: Fallback
        retry: 3
        steps:
          - {node: FollowTarget, ports: {approach: "true", distance: "${distance}", timeout_ms: "60000"}}
          - group: Sequence
            steps:
              - {node: RotateBy, ports: {radians: "0.8"}}
              - {node: DetectPerson}
              - {node: FollowTarget, ports: {approach: "true", distance: "${distance}", timeout_ms: "60000"}}

  look_at_person:
    description: "Turn the base until a visible person is centred in the camera (eye contact; no driving)"
    steps:
      - {node: DetectPerson}
      - {node: FollowTarget, ports: {timeout_ms: "5000"}}

  acknowledge_person:
    description: "Find a person, turn to face them and say hello (a greeting only: it does not follow or move with them)"
    steps:
      - {macro: find_person}
      - {macro: look_at_person}
      - {macro: say, args: {text: "Hello, I see you"}}

  guide_to:
    description: "Tell people to follow, drive to a named place, announce arrival"
    params: {place: {required: true}}
    example_args: {place: door}
    steps:
      - {macro: say, args: {text: "Please follow me"}}
      - {macro: go_to_place, args: {place: "${place}"}}
      - {macro: say, args: {text: "We have arrived"}}

  escort_person_to:
    description: "Find a person and guide them to a named place"
    params: {place: {required: true}}
    example_args: {place: door}
    steps:
      - {macro: find_person}
      - {macro: guide_to, args: {place: "${place}"}}

  wait_for_wave:
    description: "Wait (about 30 rounds) until someone waves, then say hello"
    steps:
      - group: Fallback
        retry: 30
        steps:
          - group: Sequence
            steps:
              - {node: IsPersonWaving}
              - {node: Speak, ports: {text: "Hello!"}}
          - group: Sequence
            steps:
              - {node: Sleep, ports: {msec: "200"}}
              - {node: AlwaysFailure}

  stop_and_wait:
    description: "Do nothing for a number of milliseconds"
    params: {msec: {default: "2000"}}
    steps:
      - {node: Sleep, ports: {msec: "${msec}"}}

  ask_and_repeat:
    description: "Ask a question out loud, listen for one answer (10 s) and say it back; fails if nobody answers"
    params: {question: {required: true}}
    example_args: {question: "What is your name?"}
    steps:
      - {macro: say, args: {text: "${question}"}}
      - {node: WaitForTranscript, ports: {out_text: "{answer}"}}
      - {node: Speak, ports: {text: "I heard {person}", person: "{answer}"}}

  meet_guest:
    description: "Ask a guest their name and favourite drink, remember both under a slot (guest1, guest2...) and enrol the face; retries each question twice"
    params: {slot: {default: guest1}}
    example_args: {slot: guest1}
    steps:
      - group: Fallback
        retry: 2
        steps:
          - group: Sequence
            steps:
              - {node: Speak, ports: {text: "Hello, what is your name?"}}
              - {node: WaitForTranscript, ports: {out_text: "{${slot}_heard}"}}
              - {node: ExtractAnswer, ports: {kind: name, text: "{${slot}_heard}", out_value: "{${slot}_name}"}}
          - {node: Speak, ports: {text: "Sorry, please say only your name"}}
      - {node: Speak, ports: {text: "Nice to meet you {person}", person: "{${slot}_name}"}}
      - group: Fallback
        retry: 2
        steps:
          - group: Sequence
            steps:
              - {node: Speak, ports: {text: "What is your favourite drink?"}}
              - {node: WaitForTranscript, ports: {out_text: "{${slot}_heard}"}}
              - {node: ExtractAnswer, ports: {kind: drink, text: "{${slot}_heard}", out_value: "{${slot}_drink}"}}
          - {node: Speak, ports: {text: "Sorry, please say only the drink"}}
      - {node: EnrollFace, ports: {person: "{${slot}_name}"}}

  register_person:
    description: "Ask the person in front of the camera who they are, repeat the name back and ask for a yes before enrolling their face under it, then welcome them (stays where it is; the person must face the camera); up to three tries; fails if no confirmed name or no face"
    steps:
      - group: Fallback
        retry: 3
        steps:
          - group: Sequence
            steps:
              - {node: Speak, ports: {text: "Hi, who are you? Please look at me."}}
              - {node: WaitForTranscript, ports: {out_text: "{reg_heard}"}}
              - {node: ExtractAnswer, ports: {kind: name, text: "{reg_heard}", out_value: "{reg_name}"}}
              - {node: Speak, ports: {text: "Is your name {person}? Please say yes or no.", person: "{reg_name}"}}
              - {node: WaitForTranscript, ports: {out_text: "{reg_reply}"}}
              - {node: ExtractAnswer, ports: {kind: "yes", text: "{reg_reply}"}}
          - group: Sequence       # nothing heard, no name, or "no": apologise, then FAIL so the retry asks again
            steps:
              - {node: Speak, ports: {text: "Sorry, let us try again."}}
              - {node: AlwaysFailure}
      - group: Fallback
        retry: 3
        steps:
          - {node: EnrollFace, ports: {person: "{reg_name}"}}
          - group: Sequence       # no face seen in the last 2 s: wait a second and try again
            steps:
              - {node: Sleep, ports: {msec: "1000"}}
              - {node: AlwaysFailure}
      - {node: Speak, ports: {text: "Hi {person}, welcome!", person: "{reg_name}"}}

  introduce_guest:
    description: "Say the name and favourite drink remembered for a slot (see meet_guest), e.g. to the host"
    params: {slot: {default: guest1}}
    example_args: {slot: guest1}
    steps:
      - {node: Speak, ports: {text: "This is {person}", person: "{${slot}_name}"}}
      - {node: Speak, ports: {text: "Their favourite drink is {person}", person: "{${slot}_drink}"}}

  patrol_laps:
    description: "Patrol between two named places a number of times ('patrol N times', 'N laps'); laps is a plain whole number 1-10 such as \"4\""
    params: {first: {required: true}, second: {required: true}, laps: {default: "2"}}
    example_args: {first: left_room, second: right_room, laps: "3"}
    steps:
      - group: Sequence
        repeat: "${laps}"
        steps:
          - {macro: go_to_place, args: {place: "${first}"}}
          - {macro: go_to_place, args: {place: "${second}"}}

  wait_for_doorbell:
    description: "Wait for the doorbell / when someone rings the bell (listens for a steady tone, up to 60 s) and say that someone is at the door; fails if it never rings"
    steps:
      - {node: DetectSound, ports: {kind: doorbell, timeout_ms: "60000"}}
      - {macro: say, args: {text: "Someone is at the door"}}

  offer_seat:
    description: "Look for a free seat (chair, couch, bench), turning up to three quarter turns, and tell the guest to sit there and on which side it is; fails if none is found"
    steps:
      - group: Fallback
        steps:
          - {node: FindFreeSeat, ports: {out_place: "{seat_where}"}}
          - group: Sequence
            steps:
              - {node: RotateBy, ports: {radians: "1.57"}}
              - {node: FindFreeSeat, ports: {out_place: "{seat_where}"}}
          - group: Sequence
            steps:
              - {node: RotateBy, ports: {radians: "1.57"}}
              - {node: FindFreeSeat, ports: {out_place: "{seat_where}"}}
          - group: Sequence
            steps:
              - {node: Speak, ports: {text: "I cannot see a free seat"}}
              - {node: AlwaysFailure}
      - {node: Speak, ports: {text: "Please sit on the {person}", person: "{seat_where}"}}

  note_look:
    description: "Remember what is visible about the guest in front of the camera (glasses, hair colour, hat, earrings; else the colour of the top) under a slot, to tell it later; silent, and succeeds when nothing is certain"
    params: {slot: {default: guest1}}
    example_args: {slot: guest1}
    steps:
      - group: Fallback
        steps:
          - {node: DescribeAttributes, ports: {out_text: "{${slot}_look}"}}
          - {node: DescribePerson, ports: {out_text: "{${slot}_look}"}}
          - {node: AlwaysSuccess}

  tell_look:
    description: "Say what was remembered with note_look about a guest, to another person ('Alice is wearing glasses'); says nothing when nothing was certain"
    params: {slot: {default: guest1}}
    example_args: {slot: guest1}
    steps:
      - {node: Speak, ports: {text: "By the way, {person} is {detail}.", person: "{${slot}_name}", detail: "{${slot}_look}", skip_if_unknown: "true"}}

  introduce_to:
    description: "Face the nearest person and introduce a remembered guest to them by name and favourite drink (who = the name to greet, e.g. the host)"
    params: {slot: {default: guest1}, who: {default: host}}
    example_args: {slot: guest1, who: John}
    steps:
      - group: Fallback
        steps:
          - {macro: look_at_person}
          - {node: AlwaysSuccess}
      - {node: Speak, ports: {text: "Hello ${who}. This is {person}.", person: "{${slot}_name}"}}
      - {node: Speak, ports: {text: "Their favourite drink is {person}", person: "{${slot}_drink}"}}

  receive_guest:
    description: "Wait for the doorbell, go to the door, welcome the guest, face them, ask their name and favourite drink and remember them (and how they look) under a slot (opening the door is NOT automated: a person must open it)"
    params: {slot: {default: guest1}}
    example_args: {slot: guest1}
    steps:
      - {macro: wait_for_doorbell}
      - {macro: go_to_place, args: {place: door}}
      - {macro: say, args: {text: "Welcome, please come in"}}
      - group: Fallback
        steps:
          - {macro: look_at_person}
          - {node: AlwaysSuccess}
      - {macro: meet_guest, args: {slot: "${slot}"}}
      - {macro: note_look, args: {slot: "${slot}"}}

  hric_round:
    description: "Use ALONE for the whole receptionist task (it already receives both guests, introduces and seats them; never add receive_guest or offer_seat around it): receive each one at the door, lead them to the living room, introduce them to the host and each other (name, drink, how the first guest looks) and offer a free seat. host = the host's name (default host), living_place = where the host and the seats are"
    params: {host: {default: host}, living_place: {default: left_room}}
    example_args: {host: John, living_place: left_room}
    steps:
      - {macro: receive_guest, args: {slot: guest1}}
      - {macro: escort_person_to, args: {place: "${living_place}"}}
      - {macro: introduce_to, args: {slot: guest1, who: "${host}"}}
      - {macro: offer_seat}
      - {macro: receive_guest, args: {slot: guest2}}
      - {macro: escort_person_to, args: {place: "${living_place}"}}
      - {macro: introduce_to, args: {slot: guest2, who: "${host}"}}
      - {node: Speak, ports: {text: "Hello {person}. This is {detail}.", person: "{guest1_name}", detail: "{guest2_name}"}}
      - {macro: tell_look, args: {slot: guest1}}
      - {macro: offer_seat}

  follow_until_told:
    description: "Follow a person (obstacle avoiding, locked to the first person seen) and keep following until they say stop / we are here, then stop; a person who disappears is looked for where they were last seen, then if still lost it looks again (3 tries). distance = gap in metres (min 0.5)"
    params: {distance: {default: "1.0"}, words: {default: "stop,we are here,we have arrived"}}
    example_args: {distance: "1.0"}
    steps:
      - {macro: say, args: {text: "I will follow you. Say stop when we have arrived."}}
      - group: Sequence
        retry: 3
        steps:
          - {macro: find_person}
          - group: Parallel
            success_count: 1
            steps:
              - {node: FollowTarget, ports: {approach: "true", distance: "${distance}", until_cancelled: "true", lock: "true", timeout_ms: "900000"}}
              - {node: WaitForPhrase, ports: {words: "${words}", timeout_ms: "900000"}}
      - {macro: say, args: {text: "Okay, I stop here."}}

  help_me_carry:
    description: "Help Me Carry: follow the operator until they say stop (obstacle avoiding), then drive back to the start place"
    params: {distance: {default: "1.0"}}
    example_args: {distance: "1.0"}
    steps:
      - {macro: follow_until_told, args: {distance: "${distance}"}}
      - {macro: say, args: {text: "Going back to the start"}}
      - {macro: return_home}

  find_waving_person:
    description: "Look around (turning on the spot, about two full turns) until somebody waves; fails if nobody does"
    steps:
      - group: Fallback
        retry: 24
        steps:
          - {node: IsPersonWaving}
          - group: Sequence
            steps:
              - {node: RotateBy, ports: {radians: "0.5"}}
              - {node: Sleep, ports: {msec: "1500"}}
              - {node: AlwaysFailure}

  assist_waving_person:
    description: "Find somebody who waves for help, walk up to them and ask how to help; what they answer becomes the next task"
    steps:
      - {macro: find_waving_person}
      - {macro: approach_person}
      - {macro: say, args: {text: "Hello, how can I help you?"}}

  take_order:
    description: "Ask a customer what they want, repeat it back and ask for a yes before accepting it (up to 3 tries); remembers it under a slot (customer1, customer2...)"
    params: {slot: {default: customer1}}
    example_args: {slot: customer1}
    steps:
      - group: Fallback
        retry: 3
        steps:
          - group: Sequence
            steps:
              - {node: Speak, ports: {text: "Hello, what would you like to order?"}}
              - {node: WaitForTranscript, ports: {out_text: "{${slot}_order}"}}
              - {node: Speak, ports: {text: "You would like: {person}. Is that right? Please say yes or no.", person: "{${slot}_order}"}}
              - {node: WaitForTranscript, ports: {out_text: "{${slot}_reply}"}}
              - {node: ExtractAnswer, ports: {kind: "yes", text: "{${slot}_reply}"}}
          - group: Sequence
            steps:
              - {node: Speak, ports: {text: "Sorry, let us try again."}}
              - {node: AlwaysFailure}
      - {node: Speak, ports: {text: "Thank you, I will pass on your order."}}

  tell_order:
    description: "Say aloud the order remembered with take_order (to the barman at the counter)"
    params: {slot: {default: customer1}}
    example_args: {slot: customer1}
    steps:
      - {node: Speak, ports: {text: "New order: {person}.", person: "{${slot}_order}", skip_if_unknown: "true"}}

  restaurant_round:
    description: "Restaurant for two customers: wait for a customer to wave, walk up, take and confirm the order, go back to the counter and tell it, then the same for the second customer (fetching and serving the items needs the arm)"
    steps:
      - {macro: find_waving_person}
      - {macro: approach_person}
      - {macro: take_order, args: {slot: customer1}}
      - {macro: return_home}
      - {macro: tell_order, args: {slot: customer1}}
      - {macro: find_waving_person}
      - {macro: approach_person}
      - {macro: take_order, args: {slot: customer2}}
      - {macro: return_home}
      - {macro: tell_order, args: {slot: customer2}}

  # ---- arm tasks (the arm extension does nothing live until `live: true`; objects come from the arm eye, tools/arm/arm_eye.sh) ----
  dispose_rubbish:
    description: "Pick up rubbish the ARM EYE sees in front of the robot and put it in the dustbin (one item per round, rounds = how many, default 1); quietly does nothing when no rubbish is in view"
    params: {rounds: {default: "1"}}
    example_args: {rounds: "1"}
    steps:
      - group: Sequence
        repeat: "${rounds}"
        steps:
          - group: Fallback
            steps:
              - group: Sequence
                steps:
                  - {node: NextObject, ports: {task: rubbish, out_label: "{obj}", out_nav: "{nav}", out_put: "{put}"}}
                  - {macro: pick_object, args: {label: "{obj}"}}
                  - {macro: go_to_place, args: {place: "{nav}"}}
                  - {macro: put_down, args: {place: "{put}"}}
              - {node: AlwaysSuccess}

  clean_the_table_round:
    description: "Clean the Table: drive to the table (table_place), then for each object the arm eye sees pick it, take it to its place (waste -> dustbin, kitchenware -> dishwasher) and come back, up to rounds objects (default 6)"
    params: {table_place: {required: true}, rounds: {default: "6"}}
    example_args: {table_place: left_room, rounds: "6"}
    steps:
      - {macro: go_to_place, args: {place: "${table_place}"}}
      - group: Sequence
        repeat: "${rounds}"
        steps:
          - group: Fallback
            steps:
              - group: Sequence
                steps:
                  - {node: NextObject, ports: {task: clean_table, out_label: "{obj}", out_nav: "{nav}", out_put: "{put}"}}
                  - {macro: pick_object, args: {label: "{obj}"}}
                  - {macro: go_to_place, args: {place: "{nav}"}}
                  - {macro: put_down, args: {place: "{put}"}}
                  - {node: Speak, ports: {text: "I put the {person} away.", person: "{obj}", skip_if_unknown: "true"}}
                  - {macro: go_to_place, args: {place: "${table_place}"}}
              - {node: AlwaysSuccess}
      - {macro: say, args: {text: "I have finished cleaning the table"}}

  store_groceries_round:
    description: "Storing Groceries: drive to the table with the groceries (table_place), then for each item the arm eye sees pick it and put it on the shelf (saying which group it belongs to) and come back, up to rounds items (default 6)"
    params: {table_place: {required: true}, rounds: {default: "6"}}
    example_args: {table_place: left_room, rounds: "6"}
    steps:
      - {macro: go_to_place, args: {place: "${table_place}"}}
      - group: Sequence
        repeat: "${rounds}"
        steps:
          - group: Fallback
            steps:
              - group: Sequence
                steps:
                  - {node: NextObject, ports: {task: groceries, out_label: "{obj}", out_nav: "{nav}", out_put: "{put}", out_group: "{grp}"}}
                  - {macro: pick_object, args: {label: "{obj}"}}
                  - {macro: go_to_place, args: {place: "{nav}"}}
                  - {macro: put_down, args: {place: "{put}"}}
                  - {node: Speak, ports: {text: "I stored the {person} with the other {detail}.", person: "{obj}", detail: "{grp}", skip_if_unknown: "true"}}
                  - {macro: go_to_place, args: {place: "${table_place}"}}
              - {node: AlwaysSuccess}
      - {macro: say, args: {text: "I have stored the groceries"}}

  give_me_a_hand_round:
    description: "Give Me a Hand: hold the gripper open at the handover point, wait until the person says ready, close on the object, ask where it goes (table, shelf or bin) and put it there. The person decides when the gripper closes"
    params: {x: {default: "0.22"}, y: {default: "0.0"}, z: {default: "0.12"}}
    example_args: {x: "0.22", y: "0.0", z: "0.12"}
    steps:
      - {macro: say, args: {text: "Please hold the object in front of my gripper, then say ready"}}
      - group: Fallback
        steps:
          - group: Sequence
            steps:
              - {node: OpenGripper}
              - {node: MoveArmToPose, ports: {x: "${x}", y: "${y}", z: "${z}"}}
          - group: Sequence
            steps:
              - {node: Speak, ports: {text: "I cannot reach the handover point"}}
              - {node: AlwaysFailure}
      - {node: WaitForPhrase, ports: {words: "ready,okay,now,go ahead,got it", timeout_ms: "30000"}}
      - group: Fallback
        steps:
          - {node: CloseGripper}
          - group: Sequence
            steps:
              - {node: Speak, ports: {text: "I did not get it"}}
              - {node: OpenGripper}
              - {node: AlwaysFailure}
      - {macro: say, args: {text: "Thank you. Where shall I put it: table, shelf or bin?"}}
      - group: Fallback
        retry: 2
        steps:
          - group: Sequence
            steps:
              - {node: WaitForTranscript, ports: {out_text: "{hand_heard}"}}
              - {node: ExtractAnswer, ports: {kind: place, text: "{hand_heard}", out_value: "{hand_where}"}}
          - group: Sequence
            steps:
              - {node: Speak, ports: {text: "Please say table, shelf or bin"}}
              - {node: AlwaysFailure}
      - {macro: go_to_place, args: {place: "{hand_where}"}}
      - {macro: put_down, args: {place: "{hand_where}"}}

  egpsr_round:
    description: "Enhanced GPSR: bin any rubbish the arm eye sees, then look for somebody who waves for help, walk up and ask what they need (the answer becomes the next task)"
    steps:
      - {macro: dispose_rubbish}
      - {macro: assist_waving_person}

  # ---- walking around ----
  wander:
    description: "Walk around: drive about half a metre, turn a little, repeated for a number of legs (1-10). Stops for obstacles (lidar guard) and turns away instead"
    params: {legs: {default: "4"}}
    example_args: {legs: "3"}
    steps:
      - group: Sequence
        repeat: "${legs}"
        steps:
          - group: Fallback
            steps:
              - {node: DriveDistance, ports: {meters: "0.5"}}
              - {node: RotateBy, ports: {radians: "1.6"}}      # blocked: turn away, the next leg tries again
          - {node: RotateBy, ports: {radians: "0.5"}}

  wander_until_person:
    description: "Look for a person; if none is in view, walk a leg and look again, up to a number of tries (1-10); fails if nobody is found"
    params: {tries: {default: "5"}}
    example_args: {tries: "3"}
    steps:
      - group: Fallback
        retry: "${tries}"
        steps:
          - {node: DetectPerson}
          - group: Sequence
            steps:
              - {macro: wander, args: {legs: "1"}}
              - {node: AlwaysFailure}

  count_objects_at:
    description: "Go to a named place and say how many objects with this label (detector label) are seen there ('how many cups are on the dining table')"
    params: {place: {required: true}, label: {required: true}}
    example_args: {place: dining_table, label: cup}
    steps:
      - {macro: go_to_place, args: {place: "${place}"}}
      - {node: CountObjects, ports: {label: "${label}", out_count: "{n}"}}
      - {node: Speak, ports: {person: "{n}", text: "I see {person} ${label}"}}

  count_people_at:
    description: "Go to a named place and say how many people are seen there ('how many people are in the kitchen'); counts everybody, with no filter by pose"
    params: {place: {required: true}}
    example_args: {place: kitchen}
    steps:
      - {macro: go_to_place, args: {place: "${place}"}}
      - {node: CountPeople, ports: {out_count: "{n}"}}
      - {node: Speak, ports: {person: "{n}", text: "I see {person} people"}}

  count_people_wearing_at:
    description: "Go to a named place and say how many people wear a top of this colour ('how many people in the kitchen wear red'); colour is one of black, white, grey, red, orange, yellow, green, cyan, blue, purple, pink"
    params: {place: {required: true}, colour: {required: true}}
    example_args: {place: kitchen, colour: red}
    steps:
      - {macro: go_to_place, args: {place: "${place}"}}
      - {node: CountPeople, ports: {colour: "${colour}", out_count: "{n}"}}
      - {node: Speak, ports: {person: "{n}", text: "I see {person} people wearing ${colour}"}}

  tell_extreme_object_at:
    description: "Go to a named place and say which object there is the biggest, largest, smallest or thinnest (property); weight (heaviest, lightest) cannot be measured"
    params: {place: {required: true}, property: {required: true}}
    example_args: {place: shelves, property: biggest}
    steps:
      - {macro: go_to_place, args: {place: "${place}"}}
      - {node: FindExtremeObject, ports: {property: "${property}", out_label: "{x}"}}
      - {node: Speak, ports: {detail: "{x}", text: "The ${property} object is the {detail}"}}

  scout_room:
    description: "Turn a full circle in quarter turns and say how many people are seen at each stop"
    steps:
      - group: Sequence
        repeat: "4"
        steps:
          - {node: RotateBy, ports: {radians: "1.57"}}
          - {node: CountPeople, ports: {out_count: "{n}"}}
          - {node: Speak, ports: {text: "I see {person} people", person: "{n}"}}

  describe_person:
    description: "Find a person and say what colour top they are wearing (a description of the guest by their clothes)"
    steps:
      - {macro: find_person}
      - {node: DescribePerson, ports: {out_text: "{look}"}}
      - {node: Speak, ports: {text: "I see {person}", person: "{look}"}}

  announce_and_go:
    description: "Say a sentence while driving to a named place (both at the same time)"
    params: {place: {required: true}, text: {required: true}}
    example_args: {place: door, text: "On my way"}
    steps:
      - group: Parallel
        success_count: "2"
        steps:
          - {macro: go_to_place, args: {place: "${place}"}}
          - {macro: say, args: {text: "${text}"}}
