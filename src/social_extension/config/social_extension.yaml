extension: social_extension
nodes:
  Speak: {category: Action, required: [text], optional: [person, detail, pron, skip_if_unknown, voice, wait], description: "Say text through tts_node; {person} in text is replaced by the person port (unknown -> there), {detail} by the detail port, {pron} by the pron port (he or she; empty says they, and \"{pron} likes\" then becomes \"they like\"); skip_if_unknown=true says nothing and succeeds when the person / detail port is empty (a value never remembered); wait=false returns once queued"}
  EnrollFace: {category: Action, required: [person], optional: [], description: "Store the largest face seen in the last 2 s under the name in person (A-Z a-z 0-9 _ -)"}
  WaitForTranscript: {category: Action, required: [], optional: [timeout_ms, out_text], description: "Listen for one spoken answer (default 10 s, max 60 s); out_text receives what was said; fails if nobody answers. Use right after Speak asks a question"}
  ExtractAnswer: {category: Action, required: [kind, text], optional: [out_value], description: "Pull the name (kind=name, \"my name is Alice\" -> alice) or favourite drink (kind=drink) out of a heard sentence into out_value (with the lists in param/vocab.yaml a near miss is snapped to a listed name / drink, and with strict_names an unlisted name is refused); kind=gender pulls man or woman (man, male, boy, he ... / woman, female, girl, she ...); kind=age pulls a number from 1 to 120 (\"I am twenty five\" -> 25); kind=place pulls the arm place (table, shelf or bin; \"dustbin\" -> bin) named in it; fails if none is found. kind=yes checks a yes/no answer: succeeds on yes/yeah/sure, fails on no or an unclear answer"}
  DetectSound: {category: Action, required: [], optional: [kind, timeout_ms], description: "Wait (default 30 s) until a doorbell-like steady tone is heard (kind=doorbell); fails on timeout. Tuned on synthetic tones only"}
  WaitForPhrase: {category: Action, required: [words], optional: [timeout_ms, out_text], description: "Listen (default 15 min, max 60 min) until the person says one of the words or phrases (comma separated, e.g. \"stop,we are here\"); other speech is ignored. Use in a Parallel next to a long action (FollowTarget until_cancelled) to end it by voice"}
