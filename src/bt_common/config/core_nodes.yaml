# BehaviorTree.CPP v4 built-ins + perception condition nodes of this framework.
nodes:
  Sequence:             {category: Control}
  ReactiveSequence:     {category: Control}
  Fallback:             {category: Control}
  ReactiveFallback:     {category: Control}
  Parallel:             {category: Control, optional: [success_count, failure_count]}
  RetryUntilSuccessful: {category: Decorator, required: [num_attempts]}
  Repeat:               {category: Decorator, required: [num_cycles]}
  Timeout:              {category: Decorator, required: [msec]}
  Inverter:             {category: Decorator}
  ForceSuccess:         {category: Decorator}
  ForceFailure:         {category: Decorator}
  AlwaysSuccess:        {category: Action, mode: sync}
  AlwaysFailure:        {category: Action, mode: sync}
  Sleep:                {category: Action, required: [msec], description: "Wait msec milliseconds"}
  DetectObject:         {category: Condition, required: [label], optional: [min_conf, out_bbox], description: "True while the camera sees an object with this label (use only the listed labels); out_bbox receives x_min,y_min,x_max,y_max"}
  DetectPerson:         {category: Condition, optional: [min_conf, out_track_id], description: "True while a person is visible"}
  RecognizeFace:        {category: Condition, optional: [identity, min_similarity], description: "True while a known face (or the named identity) is recognised"}
  ExtractFaceFeature:   {category: Condition, optional: [min_conf, out_identity, out_similarity], description: "True once a face feature was extracted; out_identity receives the recognised name or unknown"}
