llm_bridge_node:
  ros__parameters:
    server_url: "http://127.0.0.1:8080"   # llama-server (llama.cpp), OpenAI-compatible API
    model: "default"                      # llama-server ignores/echoes this
    temperature: 0.1
    max_tokens: 512
    timeout_sec: 60.0
    task_system_prompt: ""                # empty -> built-in prompt
