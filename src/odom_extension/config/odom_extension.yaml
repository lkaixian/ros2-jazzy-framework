extension: odom_extension
nodes:
  NavigateTo: {category: Action, required: [x, y], optional: [yaw, frame, tolerance], description: "Drive to a pose in the odom/map frame"}
  DriveDistance: {category: Action, required: [meters], optional: [speed], description: "Drive straight a distance"}
  RotateBy: {category: Action, required: [radians], optional: [speed], description: "Rotate in place"}
  IsAtGoal: {category: Condition, required: [x, y], optional: [tolerance], description: "Odometry within tolerance of goal"}
