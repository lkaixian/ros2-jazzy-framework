extension: pose_extension
nodes:
  GetPersonPose: {category: Condition, required: [], optional: [track_id, min_conf], description: "A person with a usable pose skeleton is visible"}
  IsPersonWaving: {category: Condition, required: [], optional: [track_id, min_conf], description: "A person is waving"}
  IsPersonPointing: {category: Condition, required: [], optional: [track_id, direction, min_conf], description: "A person is pointing (direction: left|right in image coordinates)"}
  CountPeople: {category: Condition, required: [], optional: [min_conf, colour, out_count], description: "Counts the people in view right now, only those wearing the top colour `colour` when given (black, white, grey, red, orange, yellow, green, cyan, blue, purple, pink); out_count receives the number (0 is a valid answer); fails only if the detector is silent"}
  DescribePerson: {category: Action, required: [], optional: [track_id, min_conf, out_text], description: "Describe the nearest person in view by the colour of their top (out_text = 'a person wearing a red top'); fails if nobody with a readable colour is in view"}
  CountObjects: {category: Condition, required: [label], optional: [min_conf, out_count], description: "Counts objects with this label (detector labels only) in view right now; out_count receives the number; fails only if the detector is silent"}
  FindExtremeObject: {category: Condition, required: [property], optional: [min_conf, out_label], description: "Which visible object is the biggest / largest / smallest / thinnest, by its size in the image (out_label receives its label); weight cannot be measured and fails"}
  FindFreeSeat: {category: Condition, required: [], optional: [min_conf, out_label, out_bearing, out_place, out_radians], description: "ONLY for empty seats (never to look for other objects): a chair no person sits on, or the free part of a couch or bench beside the people sitting there (out_place then starts 'free part of the', and out_bearing / out_radians point at that free part, not the middle of the couch); out_label = what it is, out_place = e.g. 'chair on my left' (to say aloud), out_bearing = -1 (left) .. +1 (right) in the image; fails if none (the detector needs chair/couch labels)"}
  DescribeAttributes: {category: Action, required: [], optional: [min_conf, out_text, out_glasses, out_hair], description: "Say what is visible about the nearest guest's face: glasses, hair colour, hat, earrings / necklace (out_text = 'wearing glasses and with brown hair'; out_glasses yes|no|empty, out_hair colour|empty). Only certain things are reported; fails when nothing is certain or no face is close enough"}
  NextObject: {category: Action, required: [task], optional: [min_conf, out_label, out_nav, out_put, out_group], description: "The next object the ARM EYE sees that an arm task handles (task = clean_table | groceries | rubbish) and where it goes: out_label (detector label, for PickObject), out_nav (named place to drive to), out_put (arm place for PlaceObject), out_group (what it is, e.g. drinks). Table: param/object_categories.yaml; prefers another label than the last one; fails when nothing handleable is in view"}
  FindPerson: {category: Action, required: [who], optional: [max_age_sec, out_track_id], description: "The track id of the person remembered under the name in who (a face the gallery recognised) when they are in view now; then FollowTarget track_id=<id> with only a timeout turns the base to look at them; fails when that person is not in view"}
  DescribeUnique: {category: Action, required: [], optional: [track_id, min_features, max_features, out_text, out_unique, out_track_id], description: "Describe a person (default the nearest) by the fewest remembered features that nobody else in the room shares: colour of the top and bottoms, hair colour, glasses, sitting or standing, at least min_features (2) and at most max_features (4); out_unique is false when the features do not tell them apart from someone else. Only what the detectors saw at least twice is used; look around the room first so the others are known"}
  DescribeLocation: {category: Action, required: [], optional: [track_id, out_text, out_track_id], description: "Where a person (default the nearest) is, from detected objects around them: sitting on the couch, standing in front of the chair, next to the tv; fails when no object is near enough to say (COCO classes only: couch, chair, bench, bed, tv, potted plant, dining table, ...)"}
  PointedObject: {category: Action, required: [], optional: [labels, out_label, out_colour, out_place, out_bbox, out_bearing], description: "Which bag the nearest person is pointing at (labels default backpack,handbag,suitcase): the extended arm's line from elbow through wrist against the bag boxes in the camera; out_bbox is x1,y1,x2,y2 in image pixels; fails when no arm is out or no bag lines up"}
  EstimateGender: {category: Action, required: [], optional: [min_conf, out_value, out_pronoun, out_age], description: "Man or woman (out_value), he or she (out_pronoun) and about how old (out_age) from the biggest face in view, voted over three looks 0.3 s apart; fails when the looks disagree, no face is close enough, or the model is missing (models/genderage/genderage.onnx). InsightFace genderage, non-commercial research licence; accuracy on this camera unmeasured. Say they when it fails"}
  WaitForStop: {category: Action, required: [], optional: [words, timeout_ms, still_sec, sign], description: "Succeeds when the person being followed tells the robot to stop: the word stop (or one of the comma separated words, e.g. \"stop,we are here\") or the hand sign held for a second (sign=five: five extended fingers on a raised hand, read by the hand-landmark models in models/hand/; sign=raised: any hand held above the shoulder; sign=off: voice only; default five, or raised when the models are missing), and ONLY while that person stands still (still_sec, default 1.5 s: they moved less than 0.3 m); a stop from anyone else, or said while the operator walks, is ignored. Use in a Parallel next to FollowTarget (needs persons with depth, odometry, the speech transcript). sign=five needs the two ONNX files in models/hand/ (docs/perception.md); a palm detector also fires on faces, so only a hand on the operator's own raised arm counts"}
  DescribeWithVLM: {category: Action, required: [], optional: [track_id, looks, out_text, out_gender, out_pronoun, out_age, out_hair, out_glasses, out_top], description: "Describe the nearest person (or track_id) with a vision-language model (vlm_url, default the planner's llama-server with Gemma 4 E4B + mmproj): clothes colour and type, hair colour and style, glasses, man or woman, about how old, in one reply per look (about 1.2 s), voted over looks (default 2, the gender must agree; the clothes colour of the detector wins); out_pronoun is he / she (empty when the model is unsure: say they). Fails when no server or no vision. The model can be wrong: it is used for descriptions, never for names or drinks"}
