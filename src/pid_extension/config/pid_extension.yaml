extension: pid_extension
nodes:
  SetPidGains: {category: Action, required: [controller, kp], optional: [ki, kd], description: "Set gains of controller heading|follow_turn|follow_range"}
  HoldHeading: {category: Action, required: [yaw], optional: [timeout_ms], description: "Turn to a heading and settle on it with PID"}
  FollowTarget: {category: Action, required: [], optional: [track_id, target_height, approach, distance, timeout_ms, until_cancelled, lock], description: "Centre a tracked person in the image, optionally approach slowly (approach=true); distance = stand-off in metres (min 0.5) when the person is depth-ranged, else target_height (fraction of image height) is used until_cancelled=true keeps following after arriving (ends on cancel, a lost target or timeout_ms, max 900 s); lock=true stays with the first person seen instead of the biggest; an obstacle ahead (not the person) makes the robot turn toward the freer side, then it fails after blocked_give_up_sec"}
