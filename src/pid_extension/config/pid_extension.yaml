extension: pid_extension
nodes:
  SetPidGains: {category: Action, required: [controller, kp], optional: [ki, kd], description: "Set gains of controller heading|follow_turn|follow_range"}
  HoldHeading: {category: Action, required: [yaw], optional: [timeout_ms], description: "Turn to a heading and settle on it with PID"}
  BackUpForFace: {category: Action, required: [], optional: [track_id, face_height, max_back, timeout_ms], description: "The camera is low, so a person close by shows only the torso: back away slowly, keeping them centred, until their nose and an eye are in the image (succeeds); fails after max_back metres (default 1.5), if the person is already far enough and still no face (turned away), if they are lost, or if something is behind; face_height = metres above the floor the face must reach (default 1.6)"}
  CheckBehind: {category: Condition, required: [], optional: [max_distance, min_distance], description: "True when the lidar sees something between min_distance (0.3 m) and max_distance (2.5 m) behind the robot: a guest following it (a wall behind counts too); false without a lidar reading. Use it to wait for a guest before leaving and to check they arrived"}
  FollowTarget: {category: Action, required: [], optional: [track_id, target_height, approach, distance, timeout_ms, until_cancelled, lock, search, trail], description: "Centre a tracked person in the image, optionally approach slowly (approach=true); distance = stand-off in metres (min 0.5) when the person is depth-ranged, else target_height (fraction of image height) is used until_cancelled=true keeps following after arriving (ends on cancel, a lost target or timeout_ms, max 900 s); lock=true stays with the first person seen instead of the biggest; an obstacle ahead (not the person) makes the robot turn toward the freer side, then it fails after blocked_give_up_sec; search=false stands still and fails after lost_sec when the person is gone, search=true (default, needs odometry) drives to where they were last seen and sweeps toward the side they left on for up to goto_sec + search_sec before failing as target lost; with lock a person whose track id changed is recognised again by clothes colour and position; it slows down as it nears anything ahead, and once per 12 s asks 'Excuse me, may I pass please?' (parameter excuse_text, via tts/speak) when blocked for over 1 s with another person within 2 m; trail=true steers toward a point on the path the person walked (about 0.8 m ahead of the robot) instead of straight at them, so it does not cut corners (needs depth ranging and odometry)"}
  RetraceTrail: {category: Action, required: [], optional: [speed, timeout_ms, arrive_m], description: "Drive back along the path the last FollowTarget trail=true recorded (newest crumb to oldest; no map needed, for the way back to the entrance): turns on the spot toward the path first, steers to a point about 0.6 m ahead along it, slows on bends; speed = m/s (default 0.2, max 0.3), arrive_m = distance to the first crumb that counts as back (default 0.4); stops for anything in the way and fails after blocked_give_up_sec; fails without a recorded trail, without fresh odometry, on cancel or after timeout_ms (default 120 s)"}
