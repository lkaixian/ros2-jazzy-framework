audio_capture_node:
  ros__parameters:
    source: arecord        # arecord | file
    device: ""             # ALSA device for arecord, e.g. plughw:2,0 (empty = default)
    file: ""               # WAV path when source=file (16-bit mono, matching sample_rate)
    loop: false
    sample_rate: 16000
    channels: 1
    chunk_ms: 100
    frame_id: microphone
