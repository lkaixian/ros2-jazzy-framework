<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="ros2-jazzy-framework: a spoken task becomes a validated behaviour tree, then runs on the robot behind a safety layer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#14233d"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L8.5 5L1 8.5z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="17.5" fill="none" stroke="#243553"/>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="60" y="58" font-size="13" font-weight="700" letter-spacing="2.4" fill="#38bdf8">ROS 2 JAZZY  ·  BEHAVIOUR TREES  ·  LLM PLANNER</text>
    <text x="58" y="122" font-size="56" font-weight="800" fill="#ffffff">ros2-jazzy-framework</text>
    <rect x="62" y="136" width="150" height="4" rx="2" fill="url(#accent)"/>
    <text x="60" y="172" font-size="23" fill="#cbd5e1">Speak a task. Get a validated behaviour tree. Watch the robot run it.</text>
    <rect x="60" y="186" width="164" height="28" rx="14" fill="#16233b" stroke="#2b3d5c"/><text x="142" y="205" text-anchor="middle" font-size="13" font-weight="600" fill="#cbd5e1">BehaviorTree.CPP v4</text><rect x="234" y="186" width="55" height="28" rx="14" fill="#16233b" stroke="#2b3d5c"/><text x="262" y="205" text-anchor="middle" font-size="13" font-weight="600" fill="#cbd5e1">Nav2</text><rect x="299" y="186" width="69" height="28" rx="14" fill="#16233b" stroke="#2b3d5c"/><text x="334" y="205" text-anchor="middle" font-size="13" font-weight="600" fill="#cbd5e1">YOLO11</text><rect x="378" y="186" width="128" height="28" rx="14" fill="#16233b" stroke="#2b3d5c"/><text x="442" y="205" text-anchor="middle" font-size="13" font-weight="600" fill="#cbd5e1">Voice in / out</text><rect x="516" y="186" width="157" height="28" rx="14" fill="#16233b" stroke="#2b3d5c"/><text x="594" y="205" text-anchor="middle" font-size="13" font-weight="600" fill="#cbd5e1">Dry-run by default</text>
    <rect x="50" y="248" width="150" height="56" rx="12" fill="#94a3b8"/><text x="125" y="272" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1220">Spoken task</text><text x="125" y="291" text-anchor="middle" font-size="11.5" font-weight="500" fill="#1e293b">text or voice</text><rect x="240" y="248" width="150" height="56" rx="12" fill="#38bdf8"/><text x="315" y="272" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1220">LLM</text><text x="315" y="291" text-anchor="middle" font-size="11.5" font-weight="500" fill="#1e293b">Gemma 4, JSON schema</text><rect x="430" y="248" width="150" height="56" rx="12" fill="#a78bfa"/><text x="505" y="272" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1220">SLM + rules</text><text x="505" y="291" text-anchor="middle" font-size="11.5" font-weight="500" fill="#1e293b">rules first, SLM retries</text><rect x="620" y="248" width="150" height="56" rx="12" fill="#fbbf24"/><text x="695" y="272" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1220">Validator</text><text x="695" y="291" text-anchor="middle" font-size="11.5" font-weight="500" fill="#1e293b">structure, ports, limits</text><rect x="810" y="248" width="150" height="56" rx="12" fill="#34d399"/><text x="885" y="272" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1220">Executor</text><text x="885" y="291" text-anchor="middle" font-size="11.5" font-weight="500" fill="#1e293b">BehaviorTree.CPP</text><rect x="1000" y="248" width="150" height="56" rx="12" fill="#e2e8f0"/><text x="1075" y="272" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1220">Robot</text><text x="1075" y="291" text-anchor="middle" font-size="11.5" font-weight="500" fill="#1e293b">Kobuki + Nav2</text>
  </g>
  <line x1="206" y1="276" x2="233" y2="276" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ah)"/><line x1="396" y1="276" x2="423" y2="276" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ah)"/><line x1="586" y1="276" x2="613" y2="276" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ah)"/><line x1="776" y1="276" x2="803" y2="276" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ah)"/><line x1="966" y1="276" x2="993" y2="276" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ah)"/>
  <path d="M810 318v7h340v-7" fill="none" stroke="#34d399" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="980" y="346" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#6ee7b7">safety layer: velocity mux, watchdog, lidar and battery guards</text>
  <text x="50" y="238" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.6" fill="#64748b">ONLY A VALIDATED PLAN REACHES THE EXECUTOR</text>
</svg>
